<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A9D4F2">
<title>AgroTwin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma coluna, barra de abas fixa embaixo (Resumo, Alertas, Tarefas, Áreas, Regras). Claro por padrão, escuro pelo sistema. */
:root{
  --bg:#EAF5E4; --panel:rgba(255,255,255,.84); --panel2:#E3EEDD; --line:rgba(18,48,31,.11);
  --fg:#12301F; --mute:#566B5E; --accent:#1B6B45; --accent-ink:#FFFFFF; --accent-soft:#C9F25C;
  --ink:#12301F; --lime:#C9F25C; --sky1:#A9D4F2; --glass:rgba(255,255,255,.84);
  --water:#2F7FD6; --warn:#9A6200; --warn-soft:#FFE9B8; --bad:#C2432E; --bad-soft:#FBDDD5; --info-soft:#D6E8FA;
  --display:'Bricolage Grotesque',Georgia,serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:30px;line-height:1.1} h2{font-size:22px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 7px 6px 7px;border-radius:50% 50% 50% 0;background:var(--accent-ink);opacity:.9;transform:rotate(-35deg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.who{font-size:13px;color:var(--mute);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.danger{color:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;width:100%;max-width:720px}
.nb{position:relative;display:grid;justify-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--mute);font-size:10.5px;font-weight:500;min-height:48px}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:grid;gap:14px}
.stack>*,.card{min-width:0}
pre.term{max-width:100%}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item > div{min-width:0}
.item b{display:block;font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--mute)}
.chev{color:var(--mute);font-family:var(--mono)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:25px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.stat.hot b{color:var(--bad)}
form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:5px;font-size:13px;color:var(--mute);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:44px;color:var(--fg)}
textarea{min-height:90px;font-family:var(--mono);font-size:13px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px}
.good{color:var(--accent);font-size:13px}
.note{font-size:12.5px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-weight:400;vertical-align:middle}
.pill.crit{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--water);border-color:transparent}
.pill.auto{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:none;padding:10px;cursor:pointer;color:var(--mute);min-height:42px}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font:inherit}
.reads{width:100%;border-collapse:collapse;font-size:14px}
.reads th{font-weight:500;color:var(--mute);text-align:left;font-size:12px;padding:6px 8px 6px 0}
.reads td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.empty{text-align:center;padding:26px 16px;color:var(--mute);border:1px dashed var(--line);border-radius:14px;background:var(--panel)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:17px;margin-bottom:4px}
.auth{min-height:100vh;display:grid;align-content:center;gap:22px;padding-block:32px;max-width:440px;margin:0 auto}
.auth h1 span{color:var(--accent)}
.spark{width:100%;height:110px;display:block}
.sp-area{fill:var(--water);fill-opacity:.14}.sp-line{fill:none;stroke:var(--water);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-dot{fill:var(--water)}.sp-lim{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:4 3}.sp-txt{fill:var(--mute);font:10px var(--mono)}
.bars{display:grid;gap:12px}
.bar{display:grid;gap:5px}
.bar-h{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar-h span:first-child{min-width:0;overflow-wrap:anywhere}
.track{position:relative;height:10px;border-radius:99px;background:var(--panel2)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--water)}
.fill.low{background:var(--bad)}
.lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.7}
.al{display:grid;gap:8px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;border-left-width:4px}
.al.crit{border-left-color:var(--bad)}.al.warn{border-left-color:var(--warn)}.al.info{border-left-color:var(--water)}
.tk{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tk input[type=checkbox]{width:22px;height:22px;min-height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.tk.done .tk-t{text-decoration:line-through;color:var(--mute)}
.tk-b{min-width:0;flex:1}
.tk-t{font-weight:500;overflow-wrap:anywhere}
.tk small{color:var(--mute)}
.late{color:var(--bad)}
.rule{display:grid;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.rule-h{display:flex;gap:12px;align-items:flex-start}
.rule-h input[type=checkbox]{width:22px;height:22px;min-height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.rule-h b{display:block;font-weight:600}
.rule-h small{color:var(--mute)}
.rule-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.chk input{width:18px;height:18px;min-height:18px;accent-color:var(--accent)}
.cyc{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.cyc i{display:block;height:100%;background:var(--accent)}
.live-v{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:-.02em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:8px}
.dot.on{background:var(--accent);animation:pulse 1.6s infinite}
.dot.off{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
pre.term{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font:12px/1.5 var(--mono);margin:0;white-space:pre;color:var(--fg)}
.logl{display:grid;gap:8px}.logi{display:flex;gap:10px;font-size:13.5px;align-items:flex-start}.logi time{font-family:var(--mono);color:var(--mute);font-size:11.5px;flex:none;padding-top:2px}
.wbars{display:flex;align-items:flex-end;gap:8px;height:90px}.wb{flex:1;display:grid;gap:4px;justify-items:center;align-content:end;height:100%}.wb i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--water);min-height:2px}.wb span{font-size:10.5px;color:var(--mute);font-family:var(--mono)}
button:disabled{opacity:.45;cursor:default}
@media(max-width:460px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rule-f{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.sync{font-size:11px;font-family:var(--mono);color:var(--mute)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* ===== padrão visual da landing ===== */
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#A9D4F2 0,#CFE7EF 220px,#EAF5E4 560px)}
body::before{background:#A9D4F2}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(26px,7vw,34px);line-height:1.05}
h3{font-size:17px}
.top{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:8px 8px 8px 14px;margin-top:8px;box-shadow:0 10px 34px rgba(18,48,31,.12)}
.brand{font-size:19px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px;display:block}
.btn{border-radius:999px;padding:0 20px;min-height:46px;background:rgba(255,255,255,.88);border:1px solid var(--line);font-weight:600;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.main:hover{background:#1d4a30}
.btn.ghost{background:none;border-color:transparent}
.btn.small{min-height:38px;padding:0 16px;font-size:14px}
.card,.stat,.item,.al,.tk,.rule,.empty{border-radius:24px;border-color:rgba(255,255,255,.9);box-shadow:0 10px 34px rgba(18,48,31,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{padding:20px}
.stat{padding:14px 16px}
.stat b{font-size:30px}
.al{border-left-width:5px}
.empty{background:var(--glass);border-style:solid}
.item{padding:16px 18px}
.item:hover,.btn:hover{box-shadow:0 12px 36px rgba(18,48,31,.14)}
.nav{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 18px 50px rgba(18,48,31,.18)}
.nav-in{max-width:560px}
.nb{border-radius:20px}
.nb[aria-current=page]{background:var(--lime);color:var(--ink);font-weight:600}
.badge{background:var(--ink);color:var(--lime)}
.seg{border-radius:999px;padding:4px;gap:4px;border-color:var(--line)}
.seg button{border-radius:999px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
input,select,textarea{border-radius:16px;background:#fff;border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--water);outline:none;box-shadow:0 0 0 3px rgba(47,127,214,.2)}
.pill{background:rgba(255,255,255,.7)}
.pill.auto{background:var(--lime);color:var(--ink)}
.note{border-radius:18px;background:rgba(255,255,255,.55);border-style:solid}
.track{background:rgba(47,127,214,.14);height:12px}
.fill{background:linear-gradient(90deg,#7DB8F2,var(--water))}
.fill.low{background:linear-gradient(90deg,#F2C46B,var(--bad))}
.cyc{background:rgba(47,127,214,.14)}.cyc i{background:linear-gradient(90deg,var(--lime),var(--accent))}
pre.term{background:rgba(255,255,255,.7);border-radius:16px}
.live-v{font-size:52px}
.tk input[type=checkbox],.rule-h input[type=checkbox],.chk input{accent-color:var(--accent)}
a{color:var(--accent)}
.livepill{justify-self:start;align-self:start;width:fit-content;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font:500 13px/1 var(--body)}
.livepill i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(201,242,92,.55);animation:pulse2 2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 6px rgba(201,242,92,0)}}
.hero{display:grid;gap:10px;margin-bottom:18px}
.hero h1{font-size:clamp(36px,10vw,52px);line-height:1;max-width:14ch}
.hero p{max-width:40ch}
.auth{gap:20px}
.auth h1{font-size:clamp(36px,10vw,52px);line-height:1}
.auth h1 span{color:var(--accent)}
.auth form{background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(18,48,31,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
@media(prefers-reduced-motion:reduce){.livepill i{animation:none}}

/* ===== fase 1 ===== */
.nav-in{grid-template-columns:repeat(5,minmax(0,1fr))}
.temp{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px}
.temp b{font:700 64px/1 var(--display);letter-spacing:-.03em}.temp span{font-size:16px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font:500 13px/1.1 var(--body)}
.days{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.dayc{flex:0 0 120px;scroll-snap-align:start;display:grid;gap:4px;align-content:start;padding:14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px}
.dayc b{font-family:var(--display);font-size:16px;text-transform:capitalize}.dayc em{font-style:normal;color:var(--mute)}.dayc .rain{color:var(--water);font-family:var(--mono);font-size:12px}
.al.ok{border-left-color:var(--accent)}.pill.ok{background:var(--lime);color:var(--ink);border-color:transparent}
.hrs{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px}.hrs i{height:26px;border-radius:5px;background:rgba(18,48,31,.08)}
.hrs i.ok{background:var(--lime);box-shadow:inset 0 0 0 1px rgba(18,48,31,.15)}.hrs i.rn{background:#9CC3F0}.hrs i.past{opacity:.35}
.hrs-l{font:600 13px var(--body);margin:10px 0 6px}.hrs-t{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mute);margin-top:4px}

/* ===== fase 3: home em blocos ===== */
#lp{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:#EAF5E4}
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.hhead .hero{margin:0}
.datechip{padding:9px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font:500 13px/1 var(--body);text-transform:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:16px;border-radius:26px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 34px rgba(18,48,31,.08);min-height:172px;overflow:hidden;align-content:start}
.kpi .kl{font:500 12.5px/1.2 var(--body);color:var(--mute)}
.kpi .kv{font:700 38px/1 var(--display);letter-spacing:-.03em}
.kpi .kv small{font:500 15px var(--body);margin-left:3px;color:var(--mute);letter-spacing:0}
.kpi .kf{font:11.5px/1.3 var(--mono);color:var(--mute)}
.kpi.dark{background:var(--ink);color:#fff;border-color:transparent}
.kpi.dark .kl,.kpi.dark .kf,.kpi.dark .kv small{color:rgba(255,255,255,.62)}
.kpi.lime{background:var(--lime);border-color:transparent}
.kpi.lime .kl,.kpi.lime .kf{color:rgba(18,48,31,.72)}
.kpi.lime .btn{justify-self:start;background:var(--ink);color:#fff;border-color:transparent}
.kchips{display:flex;flex-wrap:wrap;gap:6px;align-self:end}.kchips span{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.6);font:500 12px/1 var(--body)}
.mb{display:flex;align-items:flex-end;gap:5px;height:46px;align-self:end}
.mb i{flex:1;border-radius:6px 6px 3px 3px;background:var(--lime);min-height:4px}.mb i.e{background:rgba(255,255,255,.16)}
.mb.wet i{background:var(--water);opacity:.85}
.mid{display:flex;align-items:center;justify-content:center;align-self:center}
.ring{width:92px;height:92px}.ring-t{font:700 19px var(--display);fill:var(--ink)}
.hgrid{display:grid;gap:12px;align-items:start}
.ch{width:100%;max-width:560px;height:auto;display:block;margin:6px auto 0}.ch text{font:10.5px var(--mono);fill:var(--mute)}
.agenda{display:grid;gap:8px;margin-top:12px}
.agenda .tk{border-radius:18px;background:#fff}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.area .pill{white-space:nowrap;flex:none}.area .ar-h b{min-width:0}
.days.five .dayc{flex:1 0 92px}
.area{display:grid;gap:8px;text-align:left;padding:16px;border-radius:22px;background:#fff;border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;min-height:0;align-content:start}
.area:hover{box-shadow:0 12px 30px rgba(18,48,31,.12);transform:translateY(-1px)}
.area .ar-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.area .ar-h b{font:600 16px var(--display)}
.area small{color:var(--mute);font-size:12.5px}
.area .ar-v{display:flex;align-items:baseline;gap:8px}.area .ar-v .mono{font:700 26px var(--display)}
.bar2{height:7px;border-radius:99px;background:rgba(18,48,31,.1);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.onb .steps{margin:12px 0 16px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.onb .steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;column-gap:12px;align-items:start}
.onb .steps li::before{content:counter(s);grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font:700 15px var(--display)}
.onb .steps span{color:var(--mute);font-size:13.5px}
@media(min-width:900px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hgrid.a{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
  .ch text{font-size:8px}
  .hgrid.b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .wrap{max-width:1180px;padding-bottom:40px}
  .wrap:not(.wide)>.top~*{max-width:760px;margin-inline:auto}
  .nav{top:14px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:auto;padding:5px;border-radius:999px}
  .nav-in{display:flex;gap:2px;max-width:none}
  .nb .badge{position:static;transform:none;margin-left:-2px}
  .nb{grid-auto-flow:column;align-items:center;gap:8px;padding:8px 18px;font-size:13.5px;min-height:42px;border-radius:999px}
  .hero h1{max-width:none}
}

/* ===== fase 5: básico ===== */
.btns{display:flex;gap:8px;flex:none;align-items:center}
.exnote{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;border-radius:20px;background:#FFF3D6;border:1px solid #F0D48A;margin-bottom:14px;font-size:14px}
.exnote .pill{flex:none}.exnote p{flex:1 1 220px;margin:0;color:var(--ink)}

/* ===== fase 6: equipe ===== */
.eqrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.eqrow>div{flex:1;min-width:0}.eqrow small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.codebox{display:grid;gap:12px;padding:14px;border-radius:18px;background:var(--lime);margin-bottom:14px}
.codebox>.mono{font:700 24px var(--display);letter-spacing:.08em;word-break:break-all}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.codebox .btn.small{min-height:40px;padding:8px 16px}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}

<body>
<div id="app"></div>
<script>window.AGROTWIN_CONFIG={url:'https://fsstmdqnbmtdikikkoml.supabase.co',key:'sb_publishable_4uyt6YZ1ijZO8xaQDA5-tA_Hev63NiZ',fnUrl:'https://fsstmdqnbmtdikikkoml.supabase.co/functions/v1/smart-worker'};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var KEY='agrotwin.base.v1';
var UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
var CULTURAS=['Soja','Milho','Arroz','Trigo','Feijão','Outra'];
var SOLOS=['Arenoso','Médio','Argiloso'];
var TIPOS=['Irrigação','Adubação','Aplicação','Chuva','Plantio','Colheita','Outro'];
/* Valores iniciais propostos por mim, editáveis. Precisam de revisão de um agrônomo. */
var CICLO={'Soja':120,'Milho':135,'Arroz':130,'Trigo':125,'Feijão':90};
var DEF_RULES=function(){return {
  baixa:{on:true,lim:{'Arenoso':18,'Médio':22,'Argiloso':26},tarefa:true},
  alta:{on:true,val:40},
  ph:{on:true,min:5.5,max:6.5},
  queda:{on:true,val:8},
  semleit:{on:true,dias:7},
  colheita:{on:true,dias:15},
  chuva:{on:true,mm:10},
  offline:{on:true},
  bateria:{on:true,val:20}
};};

/* ---------- armazenamento (só neste aparelho) ---------- */


function uid(){return uuid();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){return parseFloat(String(v).replace(',','.'));}
function br(n,d){return n.toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function toDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(s,n){var d=toDate(s);d.setDate(d.getDate()+n);return iso(d);}
function daysBetween(a,b){return Math.round((toDate(b)-toDate(a))/86400000);}
function fmtDate(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function money(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}



/* ---------- estado e acesso aos dados da conta ---------- */
var S={view:'resumo',pid:null,tid:null,tab:'leituras',mode:'entrar',who:'produtor',form:null,msg:'',info:'',devId:null,sync:'ok',syncErr:'',loading:false,fatal:'',booting:false};


function prop(id){var d=mine();return d?d.props.filter(function(p){return p.id===id;})[0]:null;}
function talhao(p,id){return p?p.talhoes.filter(function(t){return t.id===id;})[0]:null;}
function sortedL(t){return t.leituras.slice().sort(function(a,b){return a.ts-b.ts;});}
function lastRead(t){var s=sortedL(t);return s.length?s[s.length-1]:null;}
function findT(d,tid){for(var i=0;i<d.props.length;i++){var t=talhao(d.props[i],tid);if(t)return {p:d.props[i],t:t};}return null;}

/* ---------- motor de automação ---------- */
function evaluate(){
  var d=mine();if(!d)return;
  d.props.forEach(function(p){p.talhoes.forEach(function(t){if(!t.ctrl)t.ctrl={on:false,alvo:30,max:240,vazao:4,ligado:false,acum:0};if(!t.atividades)t.atividades=[];});});
  var R=d.rules,wa={},wt={},td=today();
  d.props.forEach(function(p){p.talhoes.forEach(function(t){
    var ls=dailyL(t),last=ls[ls.length-1],nm=t.nome+' · '+p.nome;
    function A(key,sev,msg){wa[key]={key:key,pid:p.id,tid:t.id,sev:sev,msg:msg,nome:nm};}
    function T(key,titulo,due){wt[key]={key:key,auto:true,pid:p.id,tid:t.id,titulo:titulo,due:due,nome:nm};}
    if(R.baixa.on&&last&&!rainRecent(t,R)){
      var lim=R.baixa.lim[t.solo];
      if(last.umid<lim){
        A('baixa:'+t.id,last.umid<lim-5?'crit':'warn','Umidade em '+br(last.umid)+'% em '+fmtDate(last.data)+', abaixo do mínimo de '+br(lim)+'% para solo '+t.solo.toLowerCase()+'.');
        if(R.baixa.tarefa)T('irrigar:'+t.id+':'+last.data,'Irrigar '+t.nome,td);
      }
    }
    if(typeof soloEval==='function')soloEval(t,T);
    if(R.alta.on&&last&&last.umid>R.alta.val)A('alta:'+t.id,'warn','Umidade em '+br(last.umid)+'%, acima de '+br(R.alta.val)+'%. Risco de encharcamento.');
    if(R.ph.on&&last&&last.ph!=null&&(last.ph<R.ph.min||last.ph>R.ph.max))A('ph:'+t.id,'warn','pH '+br(last.ph)+' fora da faixa de '+br(R.ph.min)+' a '+br(R.ph.max)+'.');
    if(R.queda.on&&ls.length>=2){
      var pv=ls[ls.length-2];
      if(pv.umid-last.umid>=R.queda.val&&daysBetween(pv.data,last.data)<=3)A('queda:'+t.id,'info','Umidade caiu '+br(pv.umid-last.umid)+' pontos em '+daysBetween(pv.data,last.data)+' dia(s).');
    }
    if(R.semleit.on){
      var ref=last?last.data:t.criado,dias=daysBetween(ref,td);
      if(dias>=R.semleit.dias)A('semleit:'+t.id,'warn',(last?'Última leitura há '+dias+' dias.':'Nenhuma leitura registrada há '+dias+' dias.'));
    }
    if(R.colheita.on&&t.plantio&&CICLO[t.cultura]){
      var fim=addDays(t.plantio,CICLO[t.cultura]),rest=daysBetween(td,fim);
      if(rest<=R.colheita.dias&&rest>=-30&&!t.atividades.some(function(a){return a.tipo==='Colheita';}))T('colheita:'+t.id,'Planejar colheita de '+t.nome,fim);
    }
  });});
  d.devices=d.devices.filter(function(v){return findT(d,v.tid);});
  d.devices.forEach(function(v){
    var r=findT(d,v.tid),nm=v.nome+' · '+r.t.nome;
    function A2(key,sev,msg){wa[key]={key:key,pid:r.p.id,tid:r.t.id,sev:sev,msg:msg,nome:nm};}
    if(R.offline.on&&!v.sim){
      var ref=v.ultimo||v.criado;
      if(Date.now()-ref>3*v.intervalo*60000)A2('offline:'+v.id,'crit',v.ultimo?'Sem comunicação '+ago(v.ultimo)+'. Esperado a cada '+v.intervalo+' min.':'Nenhuma leitura recebida ainda. Confira energia e rede do aparelho.');
    }
    if(R.bateria.on&&v.bateria!=null&&v.bateria<R.bateria.val)A2('bat:'+v.id,'warn','Bateria em '+br(v.bateria,0)+'%. Troque ou recarregue em breve.');
  });
  var prev={};d.alerts.forEach(function(a){prev[a.key]=a;});
  var next=[];
  Object.keys(wa).forEach(function(k){
    var w=wa[k],o=prev[k];
    if(o){o.msg=w.msg;o.sev=w.sev;o.nome=w.nome;next.push(o);}
    else{w.id=uid();w.created=td;w.dismissed=false;next.push(w);}
  });
  d.alerts=next;
  var pt={};d.tasks.forEach(function(t){if(t.key)pt[t.key]=t;});
  var nt=d.tasks.filter(function(t){return !t.auto||t.done||wt[t.key];});
  Object.keys(wt).forEach(function(k){if(!pt[k]){var w=wt[k];w.id=uid();w.done=false;nt.push(w);}else{pt[k].due=wt[k].due;}});
  d.tasks=nt;
  save();
}

/* ---------- sensores, controle e simulação ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function el(id){return document.getElementById(id);}
function rainRecent(t,R){return t.atividades.some(function(a){return a.tipo==='Chuva'&&a.qtd>=R.chuva.mm&&daysBetween(a.data,today())<=1;});}
function logEv(msg,tid){var d=mine();d.log.unshift({id:uid(),ts:Date.now(),msg:msg,tid:tid||null});if(d.log.length>60)d.log.length=60;}
function ago(ts){if(!ts)return 'nunca';var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';var h=Math.round(m/60);if(h<48)return 'há '+h+' h';return 'há '+Math.round(h/24)+' dias';}
function stamp(ts){var x=new Date(ts);return pad(x.getDate())+'/'+pad(x.getMonth()+1)+' '+pad(x.getHours())+':'+pad(x.getMinutes());}
function newKey(){var c='abcdefghijklmnopqrstuvwxyz0123456789',s='atw_';for(var i=0;i<20;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s;}
function devStatus(dv){
  if(dv.sim)return {k:'sim',l:'simulado'};
  if(!dv.ultimo)return {k:'wait',l:'aguardando'};
  return (Date.now()-dv.ultimo)>3*dv.intervalo*60000?{k:'off',l:'offline'}:{k:'on',l:'online'};
}
function curDev(d){return d.devices.filter(function(x){return x.id===S.devId;})[0]||null;}

/* Recebe uma leitura de um dispositivo. É a mesma função que o servidor vai chamar quando o endereço de envio existir. */


function ctrlStep(t,u,dt){
  var c=t.ctrl,R=mine().rules,lim=R.baixa.lim[t.solo];
  if(c.ligado){
    c.acum=(c.acum||0)+dt;
    if(c.acum>=c.max)stopValve(t,'tempo máximo de '+br(c.max,0)+' min',false);
    else if(c.on&&u>=c.alvo)stopValve(t,'umidade-alvo de '+br(c.alvo)+'% atingida',false);
  }else if(c.on&&u<lim){
    if(rainRecent(t,R)){
      if(!c.pausaLog){c.pausaLog=true;logEv('Irrigação de '+t.nome+' em pausa: choveu o suficiente nas últimas 24 h.',t.id);}
    }else{
      c.ligado=true;c.acum=0;c.pausaLog=false;
      logEv('Irrigação ligada em '+t.nome+': umidade em '+br(u)+'%, mínimo de '+br(lim)+'%.',t.id);
    }
  }
  if(u>=lim)c.pausaLog=false;
}
function stopValve(t,why,manual){
  var c=t.ctrl,mm=Math.round(c.vazao*(c.acum||0)/60*10)/10;
  c.ligado=false;
  if(mm>0)t.atividades.push({id:uid(),data:today(),tipo:'Irrigação',det:manual?'Manual pelo painel':'Automática',qtd:mm,custo:null,auto:!manual});
  logEv('Irrigação desligada em '+t.nome+' ('+why+'). Aplicados cerca de '+br(mm)+' mm.',t.id);
  c.acum=0;
}

/* simulador de dispositivo: 1,5 s reais = 1 hora de campo */



/* ---------- atualização ao vivo sem refazer a tela inteira ---------- */
var lastSig='';
function sigOf(d){return d.alerts.map(function(a){return a.key+(a.dismissed?'d':'o');}).join('|')+'#'+d.tasks.map(function(t){return t.id+(t.done?'d':'o');}).join('|');}
function liveRefresh(){
  var d=mine();if(!d)return;
  var nv=document.querySelector('.nav');
  if(nv){var tmp=document.createElement('div');tmp.innerHTML=nav();nv.replaceWith(tmp.firstChild);}
  var ae=document.activeElement,typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
  var sig=sigOf(d),changed2=sig!==lastSig;lastSig=sig;
  var p=prop(S.pid),t=p?talhao(p,S.tid):null,x;
  if(S.view==='talhao'&&t){
    if((x=el('live')))x.innerHTML=liveInner(t,d);
    if((x=el('ctrl-btns')))x.innerHTML=ctrlBtns(t.ctrl);
    if(changed2&&!typing)render();
  }else if(S.view==='sens'){
    if((x=el('dev-list')))x.innerHTML=devListInner(d);
    var dv=curDev(d),r=dv?findT(d,dv.tid):null;
    if(r&&(x=el('live-dev')))x.innerHTML=liveInner(r.t,d);
  }else if(S.view==='resumo'){
    if((x=el('home-live')))x.innerHTML=homeLive(d);
    if((x=el('logl')))x.innerHTML=logInner(d);
    if(changed2&&!typing)render();
  }else if((S.view==='alertas'||S.view==='tarefas')&&changed2&&!typing&&!S.form){render();}
}

function barsInner(d){
  var all=[],h='';
  d.props.forEach(function(p){p.talhoes.forEach(function(t){var l=lastRead(t);if(l)all.push({p:p,t:t,l:l});});});
  all.sort(function(a,b){return a.t.nome<b.t.nome?-1:1;}).forEach(function(x){
    var lim=d.rules.baixa.lim[x.t.solo],low=x.l.umid<lim;
    h+='<div class="bar"><div class="bar-h"><span>'+esc(x.t.nome)+' <span class="mute">· '+esc(x.p.nome)+'</span></span><span class="mono">'+br(x.l.umid)+'%</span></div><div class="track" role="img" aria-label="'+br(x.l.umid)+'% de umidade, mínimo '+br(lim)+'%"><div class="fill'+(low?' low':'')+'" style="width:'+Math.min(100,x.l.umid)+'%"></div><div class="lim" style="left:'+Math.min(100,lim)+'%"></div></div></div>';
  });
  return h;
}
function logInner(d){
  return d.log.slice(0,8).map(function(e){return '<div class="logi"><time>'+stamp(e.ts)+'</time><span>'+esc(e.msg)+'</span></div>';}).join('');
}
function waterCard(d){
  var days=[],tot=0,i;
  for(i=6;i>=0;i--)days.push({d:addDays(today(),-i),mm:0});
  d.props.forEach(function(p){p.talhoes.forEach(function(t){t.atividades.forEach(function(a){
    if(a.tipo!=='Irrigação'||!a.qtd)return;
    days.forEach(function(x){if(x.d===a.data){x.mm+=a.qtd;tot+=a.qtd;}});
  });});});
  if(!tot)return '';
  var mx=Math.max.apply(null,days.map(function(x){return x.mm;}));
  var h='<div class="card"><div class="row" style="margin-bottom:10px"><h3>Água aplicada</h3><span class="mono mute" style="font-size:12px">7 dias · '+br(tot)+' mm</span></div><div class="wbars">';
  days.forEach(function(x){h+='<div class="wb"><i style="height:'+(x.mm?Math.max(4,x.mm/mx*70):2)+'px" title="'+br(x.mm)+' mm"></i><span>'+x.d.slice(8)+'</span></div>';});
  return h+'</div></div>';
}

function liveInner(t,d){
  var dv=d.devices.filter(function(x){return x.tid===t.id;})[0],c=t.ctrl;
  if(!dv)return '<div class="card row"><div><h3>Sensor em tempo real</h3><p class="mute" style="font-size:13px">Nenhum dispositivo ligado a este talhão.</p></div><button class="btn small" data-go="sens">Ligar sensor</button></div>';
  var st=devStatus(dv),lim=d.rules.baixa.lim[t.solo],vals=seriesOf(t),u=vals.length?vals[vals.length-1]:null;
  return '<div class="card"><div class="row" style="margin-bottom:8px"><h3><span class="dot '+(st.k==='on'||st.k==='sim'?'on':st.k==='off'?'off':'')+'"></span>'+esc(dv.nome)+'</h3><span class="pill">'+st.l+'</span></div>'+
  '<div class="row" style="align-items:flex-end;flex-wrap:nowrap"><div><div class="live-v mono">'+(u!=null?br(u)+'%':'—')+'</div><small class="mute">umidade agora · '+ago(dv.ultimo)+'</small></div><div style="text-align:right">'+(c.ligado?'<span class="pill auto">irrigando</span>':'<span class="pill">válvula fechada</span>')+(dv.bateria!=null?'<div class="mono mute" style="font-size:12px;margin-top:6px">bateria '+br(dv.bateria,0)+'%</div>':'')+'</div></div>'+spark(vals,lim)+'</div>';
}
function ctrlBtns(c){
  return '<button class="btn small" data-act="valv-ligar"'+(c.ligado?' disabled':'')+'>Ligar agora</button><button class="btn small" data-act="valv-desligar"'+(c.ligado?'':' disabled')+'>Desligar</button>';
}
function ctrlCard(t){
  var c=t.ctrl;
  return '<div class="card" id="ctrl"><div class="row" style="margin-bottom:6px"><h3>Irrigação automática</h3><label class="chk"><input type="checkbox" data-ctrl="on"'+(c.on?' checked':'')+'>Ativada</label></div>'+
  '<p class="mute" style="font-size:13px;margin-bottom:10px">Liga a válvula quando a umidade cai abaixo do mínimo do solo e desliga ao chegar no alvo. Não liga se choveu o suficiente nas últimas 24 h.</p>'+
  '<div class="rule-f"><label>Alvo (%)<input type="number" inputmode="decimal" data-ctrl="alvo" value="'+c.alvo+'"></label><label>Máx. (min)<input type="number" inputmode="decimal" data-ctrl="max" value="'+c.max+'"></label><label>Vazão (mm/h)<input type="number" inputmode="decimal" data-ctrl="vazao" value="'+c.vazao+'"></label></div>'+
  '<div class="row" style="justify-content:flex-start;margin-top:10px" id="ctrl-btns">'+ctrlBtns(c)+'</div>'+
  '<p class="mute" style="font-size:12px;margin-top:8px">A válvula é simulada neste protótipo. Com o controlador real, o mesmo comando vai para o equipamento.</p></div>';
}

/* ---------- tela de sensores ---------- */
function devListInner(d){
  return d.devices.map(function(dv){
    var r=findT(d,dv.tid),st=devStatus(dv);
    return '<button class="item" data-dev="'+dv.id+'"><div><b><span class="dot '+(st.k==='on'||st.k==='sim'?'on':st.k==='off'?'off':'')+'"></span>'+esc(dv.nome)+'</b><small>'+(r?esc(r.t.nome)+' · '+esc(r.p.nome):'sem talhão')+' · '+(devU(dv,d)!=null?br(devU(dv,d))+'% · '+ago(dv.ultimo):'sem leituras')+(dv.bateria!=null?' · bateria '+br(dv.bateria,0)+'%':'')+'</small></div><span><span class="pill">'+st.l+'</span> <span class="chev">›</span></span></button>';
  }).join('');
}
function devForm(d){
  var opts='';d.props.forEach(function(p){p.talhoes.forEach(function(t){opts+='<option value="'+t.id+'">'+esc(t.nome)+' · '+esc(p.nome)+'</option>';});});
  if(!opts)return '<div class="empty"><b>Cadastre um talhão primeiro</b>O sensor precisa estar ligado a um talhão.<div style="margin-top:12px"><button class="btn" data-go="props">Ir para Áreas</button></div></div>';
  return '<form class="card" data-form="dev" novalidate><h3>Novo sensor</h3>'+
  '<label for="s-nome">Nome<input id="s-nome" placeholder="Ex.: Sensor solo T1"></label>'+

/* gravação: compara o estado atual com o último gravado e envia só o que mudou */
function save(){if(!D||!sb)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(flush,600);}
function flush(){
  if(!D||!sb)return Promise.resolve();
  if(syncing){dirty=true;return Promise.resolve();}
  var R=toRows(),ups={},dels={},n=0;
  TABLES.forEach(function(t){
    var old=snap[t]||(snap[t]={});ups[t]=[];dels[t]=[];
    Object.keys(R[t]).forEach(function(k){var js=JSON.stringify(R[t][k]);if(old[k]!==js){ups[t].push({row:R[t][k],js:js,k:k});n++;}});
    Object.keys(old).forEach(function(k){if(!R[t][k]){dels[t].push(k);n++;}});
  });
  if(!n){if(S.sync!=='ok')setSync('ok');return Promise.resolve();}
  syncing=true;dirty=false;setSync('saving');
  var chain=Promise.resolve();
  TABLES.forEach(function(t){
    if(!ups[t].length)return;
    chain=chain.then(function(){return sb.from(t).upsert(ups[t].map(function(x){return x.row;})).then(function(r){if(r.error)throw r.error;ups[t].forEach(function(x){snap[t][x.k]=x.js;});});});
  });
  TABLES.slice().reverse().forEach(function(t){
    if(!dels[t].length)return;
    chain=chain.then(function(){return sb.from(t).delete().in(PK[t]||'id',dels[t]).then(function(r){if(r.error)throw r.error;dels[t].forEach(function(k){delete snap[t][k];});});});
  });
  return chain.then(function(){syncing=false;setSync('ok');if(dirty)flush();},function(e){syncing=false;setSync('error',(e&&e.message)||String(e));});
}

  if(r.dispositivo_id&&f.ctrl)ctrlStep(f,l.umid,prev?clamp((l.ts-prev.ts)/60000,0,180):0);

}

function init(){
  if(!window.supabase||!CFG.url){S.fatal='Não consegui carregar a biblioteca do banco de dados. Confira a internet e recarregue.';render();return;}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  S.loading=true;render();
  sb.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      if(session&&session.user){
        if(PROFILE&&PROFILE.id===session.user.id)return;
        if(S.loading&&S.booting)return;
        S.booting=true;boot(session);
      }else if(ev==='SIGNED_OUT'||ev==='INITIAL_SESSION'){
        S.booting=false;if(PROFILE||ev==='SIGNED_OUT')signedOut();else{S.loading=false;route();render();}
      }
    },0);
  });
  setInterval(function(){if(D){evaluate();liveRefresh();}},30000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reload();});
}

/* ---------- ciclo e manejo ---------- */
function ciclo(t){
  if(!t.plantio||!CICLO[t.cultura])return null;
  var tot=CICLO[t.cultura],dia=daysBetween(t.plantio,today()),fim=addDays(t.plantio,tot);
  var f=dia/tot,est=dia<0?'Plantio previsto':f<.35?'Emergência e crescimento':f<.6?'Floração':f<.85?'Enchimento de grãos':f<1?'Maturação':'Pronto para colher';
  return {tot:tot,dia:dia,fim:fim,est:est,pct:Math.max(0,Math.min(100,f*100))};
}
function custos(t){
  var c=0,sacas=0;t.atividades.forEach(function(a){if(a.custo)c+=a.custo;if(a.tipo==='Colheita'&&a.qtd)sacas+=a.qtd;});
  return {custo:c,sacas:sacas,porHa:t.area>0?c/t.area:0,prod:t.area>0?sacas/t.area:0};
}

function spark(vals,lim){
  if(vals.length<2)return '<p class="mute" style="font-size:13px">O gráfico aparece a partir de duas leituras.</p>';
  var w=300,hgt=110,pd=14,all=vals.concat([lim]),min=Math.min.apply(null,all)-3,max=Math.max.apply(null,all)+3;
  function X(i){return pd+i*(w-2*pd)/(vals.length-1);}
  function Y(v){return hgt-pd-(v-min)/(max-min)*(hgt-2*pd);}
  var pts=vals.map(function(v,i){return [X(i),Y(v)];}),line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(hgt-pd)+' L'+line.replace(/ /g,' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+(hgt-pd)+' Z',last=pts[pts.length-1];

  h+=rule('queda','Queda rápida de umidade','Aviso quando a umidade cai demais entre duas leituras próximas.','<div class="rule-f">'+n('queda','val','Queda (pontos)')+'</div>');

  h+=rule('colheita','Colheita chegando','Cria tarefa para planejar a colheita perto do fim do ciclo.','<div class="rule-f">'+n('colheita','dias','Dias de antecedência')+'</div>');

  h+='<div class="note">Os valores iniciais foram propostos para começar e não substituem orientação agronômica. Ajuste com seu agrônomo ou técnico da cooperativa.</div>';

document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  var d=b.dataset,D=mine();
  if(d.who){S.who=d.who;S.msg='';render();return;}
  if(!D&&!d.who&&d.act!=='recarregar')return;
  if(d.go){go(d.go);return;}
  if(d.tab){S.tab=d.tab;S.msg='';S.info='';render();return;}
  if(d.prop){S.pid=d.prop;S.tid=null;S.view='prop';S.form=null;S.msg='';render();window.scrollTo(0,0);return;}
  if(d.talhao){showT(S.pid,d.talhao);return;}
  if(d.open){var a=d.open.split('|');showT(a[0],a[1]);return;}
  if(d.dismiss){D.alerts.forEach(function(x){if(x.id===d.dismiss)x.dismissed=true;});save();render();return;}
  if(d.deltask){D.tasks=D.tasks.filter(function(x){return x.id!==d.deltask;});save();render();return;}
  if(d.delLeit){var t=talhao(prop(S.pid),S.tid);t.leituras=t.leituras.filter(function(l){return l.id!==d.delLeit;});changed();return;}
  if(d.dev){S.devId=d.dev;S.view='sens';S.form=null;S.msg='';S.info='';render();window.scrollTo(0,0);return;}
  if(d.copy){
    var src=el(d.copy),txt=src?src.textContent:'';
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent='Copiado';},function(){b.textContent='Selecione e copie';});}catch(e){b.textContent='Selecione e copie';}
    return;
  }
  if(d.delAtiv){var t2=talhao(prop(S.pid),S.tid);t2.atividades=t2.atividades.filter(function(l){return l.id!==d.delAtiv;});changed();return;}
  switch(d.act){
    case 'sair':sb.auth.signOut();break;
    case 'recarregar':location.reload();break;
    case 'nova-prop':S.view='props';S.form='prop';S.msg='';render();break;
    case 'novo-talhao':S.form='talhao';S.msg='';render();break;
    case 'nova-tarefa':S.form='tarefa';S.msg='';render();break;
    case 'cancelar':S.form=null;S.msg='';render();break;
    case 'exemplo':exemplo();S.view='props';render();break;
    case 'restaurar':D.alerts.forEach(function(x){x.dismissed=false;});save();render();break;
    case 'limpar-feitas':D.tasks=D.tasks.filter(function(x){return !x.done;});save();render();break;
    case 'del-prop':
      if(b.dataset.sure){D.props=D.props.filter(function(p){return p.id!==S.pid;});S.pid=null;evaluate();go('props');}
      else{b.dataset.sure='1';b.textContent='Toque de novo para confirmar';}
      break;
    case 'del-talhao':
      if(b.dataset.sure){var p=prop(S.pid);p.talhoes=p.talhoes.filter(function(x){return x.id!==S.tid;});S.tid=null;S.view='prop';changed();}
      else{b.dataset.sure='1';b.textContent='Toque de novo para confirmar';}
      break;
    case 'dev-novo':S.view='sens';S.devId=null;S.form='dev';S.msg='';render();break;
    case 'dev-del':
      if(b.dataset.sure){D.devices=D.devices.filter(function(x){return x.id!==S.devId;});S.devId=null;simUpdateTimer();evaluate();go('sens');}
      else{b.dataset.sure='1';b.textContent='Toque de novo para confirmar';}
      break;
    case 'sim-toggle':
      var dv=curDev(D),rr=dv?findT(D,dv.tid):null;
      if(dv&&rr){dv.sim=!dv.sim;if(dv.sim){var lr=lastRead(rr.t);dv.simU=dv.ultimaUmid!=null?dv.ultimaUmid:(lr?lr.umid:30);logEv('Simulação iniciada para '+dv.nome+'.',rr.t.id);}else logEv('Simulação parada para '+dv.nome+'.',rr.t.id);simUpdateTimer();save();render();}
      break;
    case 'sim-chuva':
      var dv2=curDev(D),r2=dv2?findT(D,dv2.tid):null;
      if(dv2&&r2){r2.t.atividades.push({id:uid(),data:today(),tipo:'Chuva',det:'Simulada',qtd:18,custo:null});dv2.rainPending=12;logEv('Chuva de 18 mm registrada em '+r2.t.nome+' (simulada).',r2.t.id);changed();}
      break;
    case 'valv-ligar':
      var tv=talhao(prop(S.pid),S.tid);
      if(tv){tv.ctrl.ligado=true;tv.ctrl.acum=0;logEv('Irrigação ligada manualmente em '+tv.nome+'.',tv.id);save();render();}
      break;
    case 'valv-desligar':
      var tv2=talhao(prop(S.pid),S.tid);
      if(tv2&&tv2.ctrl.ligado){stopValve(tv2,'desligada pelo painel',true);evaluate();render();}
      break;
    case 'bk-gerar':
      var ta=document.getElementById('bk');
      ta.value=JSON.stringify({v:2,props:D.props,tasks:D.tasks,rules:D.rules,alerts:D.alerts,devices:D.devices,log:D.log});
      ta.focus();ta.select();
      var m=document.getElementById('bk-msg');m.className='good';
      try{navigator.clipboard.writeText(ta.value).then(function(){m.textContent='Cópia gerada e copiada.';},function(){m.textContent='Cópia gerada. Selecione o texto e copie.';});}
      catch(e){m.textContent='Cópia gerada. Selecione o texto e copie.';}
      break;
    case 'bk-restaurar':
      var tx=document.getElementById('bk').value.trim(),mm=document.getElementById('bk-msg');mm.className='err';
      try{
        var o=JSON.parse(tx);
        if(!o||!Array.isArray(o.props))throw new Error('x');
        D.props=o.props;D.devices=o.devices||[];D.log=o.log||[];D.tasks=o.tasks||[];D.alerts=o.alerts||[];if(o.rules)D.rules=o.rules;
        S.info='Cópia restaurada.';changed();
        var m2=document.getElementById('bk-msg');if(m2)m2.className='good';
      }catch(e){mm.textContent='Texto inválido. Cole a cópia completa gerada por este app.';}
      break;
  }
});

/* checkboxes e valores de regras / tarefas */
document.addEventListener('change',function(ev){
  var t=ev.target,D=mine();if(!D)return;
  if(t.dataset.task){D.tasks.forEach(function(x){if(x.id===t.dataset.task)x.done=t.checked;});save();render();return;}
  if(t.dataset.ctrl){
    var tt=talhao(prop(S.pid),S.tid);if(!tt)return;
    if(t.dataset.ctrl==='on'){tt.ctrl.on=t.checked;logEv('Irrigação automática '+(t.checked?'ativada':'desativada')+' em '+tt.nome+'.',tt.id);save();render();}
    else{var cv=num(t.value);if(!isNaN(cv)&&cv>0){tt.ctrl[t.dataset.ctrl]=cv;save();}}
    return;
  }
  if(t.dataset.devf){
    var dv3=curDev(D);if(!dv3)return;var fv=num(t.value);
    if(!isNaN(fv)&&fv>0){dv3[t.dataset.devf]=fv;save();}
    return;
  }
  if(t.dataset.rule){var p=t.dataset.rule.split('.');D.rules[p[0]][p[1]]=t.checked;changed();return;}
  if(t.dataset.ruleVal){
    var v=num(t.value);if(isNaN(v))return;
    var q=t.dataset.ruleVal.split('.');

function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

function parseDate(s){
  s=s.trim();var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}

/* ===== Fase 1: clima real, solo e recomendações (Open-Meteo, sem chave) ===== */
var CLIMA={},DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
var UFN={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
var KC={'Soja':[.4,1.15,.5],'Milho':[.4,1.2,.6],'Arroz':[1.05,1.2,.9],'Trigo':[.4,1.15,.4],'Feijão':[.4,1.15,.35]};
var KCN=['início do ciclo','pleno desenvolvimento','maturação'];
var SEMT={'Soja':20,'Milho':18,'Arroz':20,'Trigo':12,'Feijão':20};
function nrm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function wmo(c){return c===0?'Céu limpo':c<=2?'Poucas nuvens':c===3?'Nublado':c<=48?'Neblina':c<=57?'Garoa':c<=67?'Chuva':c<=77?'Frio intenso':c<=82?'Pancadas de chuva':'Tempestade';}
function geoOf(p){
  var k='atw-geo:'+nrm(p.mun)+'|'+nrm(p.uf),c=lsGet(k);
  if(c)return Promise.resolve(c);
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(p.mun)+'&count=10&language=pt&country_code=BR').then(function(r){return r.json();}).then(function(j){
    var rs=j.results||[];if(!rs.length)throw new Error('Não encontrei o município "'+p.mun+'". Confira o nome na propriedade.');
    var st=nrm(UFN[String(p.uf||'').toUpperCase()]),hit=rs.filter(function(r){return nrm(r.admin1)===st;})[0]||rs[0];
    var g={lat:hit.latitude,lon:hit.longitude,nome:hit.name};lsSet(k,g);return g;
  });
}
function fetchClima(p){
  return geoOf(p).then(function(g){
    var u='https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+'&timezone=auto&past_days=3&forecast_days=7'+
    '&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code'+
    '&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,soil_temperature_6cm,soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm,soil_moisture_27_to_81cm'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,et0_fao_evapotranspiration,wind_speed_10m_max';
    return fetch(u).then(function(r){if(!r.ok)throw new Error('O serviço de clima respondeu '+r.status+'.');return r.json();}).then(function(j){
      if(!j.daily||!j.hourly)throw new Error('Resposta do clima incompleta.');
      return {geo:g,cur:j.current,h:j.hourly,d:j.daily,at:Date.now()};
    });
  });
}
function loadClima(p){
  var c=CLIMA[p.id]||(CLIMA[p.id]={st:'idle'});
  if(c.busy)return;c.busy=true;if(!c.data)c.st='load';
  fetchClima(p).then(function(d){c.data=d;c.st='ok';c.msg='';lsSet('atw-clima:'+p.id,{data:d});})
  .catch(function(e){c.st=c.data?'ok':'err';c.msg=(e&&e.message)||'Falha de rede.';})
  .then(function(){c.busy=false;c.tried=Date.now();if((S.view==='clima'||S.view==='resumo')&&!isTyping())render();});
}
function climaOf(p){
  var c=CLIMA[p.id];
  if(!c){var ls=lsGet('atw-clima:'+p.id);c=CLIMA[p.id]=ls&&ls.data?{st:'ok',data:ls.data}:{st:'idle'};}
  var stale=c.data&&Date.now()-c.data.at>1800000;
  if(p.mun&&!c.busy&&(c.st==='idle'||stale||(c.st==='err'&&Date.now()-c.tried>60000)))loadClima(p);
  return c;
}
/* índices úteis */
function ix(cl){
  var d=cl.d,t=today(),di=d.time.indexOf(t);if(di<0)di=3;
  var hh=(cl.cur&&cl.cur.time||'').slice(0,13),hi=cl.h.time.findIndex(function(x){return x.slice(0,13)>=hh;});if(hi<0)hi=di*24;
  return {di:di,hi:hi};
}
function sum(a,i,n){var s=0;for(var k=i;k<i+n&&k<a.length;k++)s+=(a[k]||0);return s;}
function dayLbl(cl,di){var s=cl.d.time[di];return s?DSEM[toDate(s).getDay()]:'';}
function kcOf(t){
  var k=KC[t.cultura];if(!k||!t.plantio)return null;
  var dia=daysBetween(t.plantio,today()),f=dia/CICLO[t.cultura];if(f<0||f>1)return null;
  var e=f<.2?0:f<.75?1:2;return {kc:k[e],est:KCN[e]};
}
/* motor de recomendações: regras agronômicas propostas, validar com agrônomo */
function spray(cl,I){
  var h=cl.h,out=[];
  for(var i=0;i<h.time.length;i++){
    var w=h.wind_speed_10m[i],rh=h.relative_humidity_2m[i],t=h.temperature_2m[i],r=sum(h.precipitation,i,3);
    out.push(w>=3&&w<=10&&rh>=55&&t<=30&&r===0);
  }
  var best=null,s=-1;
  for(var j=I.hi;j<=Math.min(out.length,I.hi+48);j++){
    if(out[j]&&s<0)s=j;
    if((!out[j]||j===out.length)&&s>=0){if(!best||j-s>best.n)best={s:s,n:j-s};s=-1;}
  }
  if(best&&best.n<2)best=null;
  return {ok:out,best:best};
}
function recomendar(p,cl,d){
  var I=ix(cl),D=cl.d,H=cl.h,R=[],tal=[];
  p.talhoes.forEach(function(t){var k=kcOf(t);if(k)tal.push(k.kc);});
  var kc=tal.length?tal.reduce(function(a,b){return a+b;},0)/tal.length:1,
      r48=sum(D.precipitation_sum,I.di,2),r3=sum(D.precipitation_sum,I.di,3),et3=sum(D.et0_fao_evapotranspiration,I.di,3)*kc,def=et3-r3;
  if(r48>=12)R.push({n:'info',t:'Segure a irrigação',x:'Há '+br(r48,0)+' mm de chuva prevista em 48 h. Espere a chuva passar antes de irrigar.'});
  else if(def>=10)R.push({n:def>=20?'crit':'warn',t:'Irrigação recomendada',x:'Nos próximos 3 dias a lavoura deve perder cerca de '+br(et3,0)+' mm e a chuva prevista é de '+br(r3,0)+' mm. Déficit de ~'+br(def,0)+' mm (≈ '+br(def*10,0)+' m³ por hectare).'});
  else R.push({n:'ok',t:'Água em dia',x:'Chuva prevista ('+br(r3,0)+' mm) e demanda da cultura ('+br(et3,0)+' mm) estão equilibradas nos próximos 3 dias.'});
  var tmin=Infinity,td=0;for(var i=I.di;i<I.di+4&&i<D.time.length;i++){if(D.temperature_2m_min[i]<tmin){tmin=D.temperature_2m_min[i];td=i;}}
  if(tmin<=1)R.push({n:'crit',t:'Risco de geada',x:'Mínima de '+br(tmin,0)+' °C na '+dayLbl(cl,td)+'. Proteja culturas sensíveis e evite plantar ou aplicar nessa madrugada.'});
  else if(tmin<=3)R.push({n:'warn',t:'Frio intenso',x:'Mínima de '+br(tmin,0)+' °C na '+dayLbl(cl,td)+'. Fique atento à possibilidade de geada em baixadas.'});
  var tmax=-Infinity,xd=0;for(i=I.di;i<I.di+4&&i<D.time.length;i++){if(D.temperature_2m_max[i]>tmax){tmax=D.temperature_2m_max[i];xd=i;}}
  if(tmax>=35)R.push({n:'warn',t:'Calor forte',x:'Máxima de '+br(tmax,0)+' °C na '+dayLbl(cl,xd)+'. Há risco de estresse térmico e de maior demanda de água.'});
  var pm=0,pd=0;for(i=I.di;i<I.di+3&&i<D.time.length;i++){if(D.precipitation_sum[i]>pm){pm=D.precipitation_sum[i];pd=i;}}
  if(pm>=50)R.push({n:'warn',t:'Chuva muito forte',x:'Previsão de '+br(pm,0)+' mm na '+dayLbl(cl,pd)+'. Atenção a encharcamento e erosão nos talhões.'});
  var sp=spray(cl,I);
  if(sp.best){var s=sp.best.s,e=s+sp.best.n,dy=Math.floor(s/24)-I.di,hs=s%24,he=e%24;
    R.push({n:'info',t:'Janela de pulverização',x:'Melhor período nas próximas 48 h: '+(dy<=0?'hoje':dy===1?'amanhã':'em '+dy+' dias')+', das '+hs+'h às '+he+'h (vento entre 3 e 10 km/h, umidade acima de 55%, sem chuva).'});
  }else R.push({n:'warn',t:'Sem janela boa para pulverizar',x:'Nas próximas 48 h o vento, a umidade ou a chuva não ficam nos limites seguros. Adie a aplicação.'});
  var fh=0;for(i=I.hi;i<I.hi+72&&i<H.time.length;i++){if(H.relative_humidity_2m[i]>=90&&H.temperature_2m[i]>=18&&H.temperature_2m[i]<=30)fh++;}
  if(fh>=30)R.push({n:'warn',t:'Clima favorável a doenças',x:'Cerca de '+fh+' horas com umidade acima de 90% e temperatura entre 18 e 30 °C nos próximos 3 dias. Vistorie os talhões atrás de ferrugem e manchas foliares.'});
  var o={crit:0,warn:1,info:2,ok:3};R.sort(function(a,b){return o[a.n]-o[b.n];});
  return R;
}
function recCard(r,pre){
  return '<div class="al '+r.n+'"><div><span class="pill '+r.n+'">'+({crit:'Urgente',warn:'Atenção',info:'Dica',ok:'Tudo certo'})[r.n]+'</span> <b>'+(pre?esc(pre)+' · ':'')+esc(r.t)+'</b></div><p style="font-size:14px">'+esc(r.x)+'</p></div>';
}
/* início: cartão de clima e recomendações */
function homeClima(d){

  h+='<div class="stack" style="gap:8px"><h3>Recomendações do dia</h3>'+R.map(function(r){return recCard(r);}).join('')+'</div>';

}
/* aba Clima e solo */
function svgChuva(cl,I){
  var D=cl.d,n=Math.min(10,D.time.length),W=330,Hh=120,bw=W/n,mx=5;

  for(i=0;i<n;i++){
    var r=D.precipitation_sum[i]||0,e=D.et0_fao_evapotranspiration[i]||0,x=i*bw,bh=r/mx*Hh,ey=Hh-e/mx*Hh;
    s+='<rect x="'+(x+6)+'" y="'+(Hh-bh)+'" width="'+(bw-12)+'" height="'+bh+'" rx="4" fill="'+(i<I.di?'#9CC3F0':'var(--water)')+'"/>'+
       '<line x1="'+(x+3)+'" x2="'+(x+bw-3)+'" y1="'+ey+'" y2="'+ey+'" stroke="#D18B00" stroke-width="3" stroke-linecap="round"/>'+
       '<text class="sp-txt" x="'+(x+bw/2)+'" y="'+(Hh+15)+'" text-anchor="middle"'+(i===I.di?' font-weight="700"':'')+'>'+(i===I.di?'hoje':dayLbl(cl,i))+'</text>';
  }
  return s+'</svg>';
}
function climaView(){
  var d=mine(),h='<div class="row" style="margin-bottom:10px"><h2>Clima e solo</h2><button class="btn small" data-cretry="1">Atualizar</button></div>';
  if(!d.props.length)return h+'<div class="empty"><b>Cadastre uma propriedade</b>Informe o município e a AgroTwin busca o clima, a previsão e o solo do local.<div style="margin-top:14px"><button class="btn main" data-go="props">Cadastrar propriedade</button></div></div>';

  if(d.props.length>1)h+='<div class="seg" role="group" aria-label="Propriedade">'+d.props.map(function(x){return '<button type="button" data-cprop="'+x.id+'" aria-pressed="'+(x.id===p.id)+'">'+esc(x.nome)+'</button>';}).join('')+'</div>';

  var c=climaOf(p);
  if(!c.data)return h+'<div class="card"><h3>'+(c.st==='err'?'Não consegui buscar o clima':'Buscando dados de '+esc(p.mun)+'…')+'</h3><p class="mute" style="margin-top:6px">'+esc(c.msg||'Isso leva alguns segundos.')+'</p></div></div>';
  var cl=c.data,cu=cl.cur,I=ix(cl),D=cl.d,H=cl.h,hh=new Date(cl.at);
  h+='<div class="card"><span class="livepill"><i></i>'+esc(cl.geo.nome)+' · '+pad2(hh.getHours())+':'+pad2(hh.getMinutes())+'</span><div class="temp"><b>'+br(cu.temperature_2m,0)+'°</b><span>'+wmo(cu.weather_code)+'</span></div>'+

var V2C={'Soja':60,'Milho':65,'Arroz':50,'Trigo':60,'Feijão':70,'Outra':60};

function soloCalc(a,v2,prnt){
  var ca=fnum(a.ca),mg=fnum(a.mg),k=fnum(a.k),hal=fnum(a.hal),al=fnum(a.al),r={};
  if(ca!=null&&mg!=null&&k!=null){r.sb=ca+mg+k/391;}
  if(r.sb!=null&&hal!=null){r.ctc=r.sb+hal;r.v=r.ctc>0?r.sb/r.ctc*100:null;}
  if(al!=null&&r.sb!=null){var q=r.sb+al;r.m=q>0?al/q*100:null;}
  if(r.v!=null&&v2>0&&prnt>0){r.nc=Math.max(0,(v2-r.v)*r.ctc/prnt);}
  return r;
}

  if(ph!=null&&ph<5.5)L.push({n:'warn',t:'pH baixo (acidez)',x:'pH '+br(ph)+' em CaCl₂, abaixo da faixa de 5,5 a 6,5. A acidez reduz a absorção de nutrientes e prejudica as raízes.'});

  if(c.m!=null&&c.m>20)L.push({n:'warn',t:'Alumínio tóxico',x:'Saturação por alumínio de '+br(c.m)+'%, acima de 20%. A calagem corrige a camada arável; para o subsolo, peça avaliação de gessagem com análise de 20 a 40 cm.'});

    }else L.push({n:'ok',t:'Calagem não necessária',x:'Saturação por bases de '+br(c.v)+'%, já no nível de '+br(P.v2,0)+'% indicado para '+t.cultura+'.'});
  }else if(c.v==null)L.push({n:'info',t:'Dados incompletos para calagem',x:'Preencha cálcio, magnésio, potássio e H+Al para calcular a saturação por bases e a necessidade de calcário.'});
  L.push({n:'info',t:'Fósforo, potássio e nitrogênio',x:'As doses dependem do teor no solo, da argila, da cultura e da produtividade esperada, e variam por estado. Use o manual de adubação da sua região (CQFS RS/SC, Embrapa, Ceres) ou um agrônomo. Esta tela não calcula essas doses.'});

function hAvg(a){var s=0;a.forEach(function(x){s+=x;});return a.length?s/a.length:null;}

  var H={np:d.props.length,nt:0,ha:0,custo:0,rows:[],al:d.alerts.filter(function(a){return !a.dismissed;}),tk:d.tasks.filter(function(t){return !t.done;})};
  var td=today(),days=[],by={},i,mins=[];
  for(i=6;i>=0;i--){var dd=addDays(td,-i);var o={d:dd,v:[]};days.push(o);by[dd]=o;}
  d.props.forEach(function(p){p.talhoes.forEach(function(t){
    H.nt++;H.ha+=t.area||0;H.custo+=custos(t).custo;
    var l=lastRead(t),lim=d.rules.baixa.lim[t.solo],mx=d.rules.alta.val;
    if(l){H.rows.push({p:p,t:t,l:l,lim:lim,ok:l.umid>=lim&&l.umid<=mx,low:l.umid<lim});mins.push(lim);}
    t.leituras.forEach(function(x){var k=x.ts?iso(new Date(x.ts)):x.data;if(by[k])by[k].v.push(x.umid);});
  });});
  H.days=days.map(function(x){return {d:x.d,v:hAvg(x.v),n:x.v.length};});
  H.nl=H.days.reduce(function(a,x){return a+x.n;},0);
  H.avg=hAvg(H.rows.map(function(r){return r.l.umid;}));

  return H;
}

/* ===== Fase 4: município escolhido da lista oficial (IBGE) e clima fixado na cidade ===== */
var MUN={};
function munList(uf){
  if(MUN[uf])return Promise.resolve(MUN[uf]);
  var c=lsGet('atw-mun:'+uf);if(c&&c.length>3){MUN[uf]=c;return Promise.resolve(c);}
  return fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/'+uf+'/municipios?orderBy=nome').then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(j){
    var a=j.map(function(m){return m.nome;}).filter(Boolean);if(!a.length)throw new Error('lista vazia');
    MUN[uf]=a;lsSet('atw-mun:'+uf,a);return a;
  });
}
function propForm(){
  return '<form class="card" data-form="prop" novalidate><h3>Nova propriedade</h3>'+
  '<label for="p-nome">Nome<input id="p-nome" placeholder="Ex.: Fazenda Boa Vista"></label>'+
  '<div class="grid2"><label for="p-uf">Estado<select id="p-uf">'+UFS.map(function(u){return '<option'+(u==='RS'?' selected':'')+'>'+u+'</option>';}).join('')+'</select></label>'+
  '<label for="p-mun">Município<input id="p-mun" list="p-mun-list" autocomplete="off" autocapitalize="words" placeholder="Digite para buscar"></label></div>'+
  '<datalist id="p-mun-list"></datalist><p class="mute" id="p-mun-st" style="font-size:12.5px;margin:-4px 0 12px">Escolha o estado e digite o município.</p>'+
  '<label for="p-area">Área total (hectares)<input id="p-area" inputmode="decimal" placeholder="Ex.: 120"></label>'+
  '<div class="err" role="alert">'+esc(S.msg)+'</div>'+
  '<div class="row"><button type="button" class="btn ghost" data-act="cancelar">Cancelar</button><button class="btn main" type="submit">Salvar propriedade</button></div></form>';
}
function mnFill(){
  var u=document.getElementById('p-uf'),dl=document.getElementById('p-mun-list'),st=document.getElementById('p-mun-st');if(!u||!dl||!st)return;
  var uf=u.value;
  if(!MUN[uf])st.textContent='Carregando os municípios de '+uf+'…';
  munList(uf).then(function(a){
    var u2=document.getElementById('p-uf'),d2=document.getElementById('p-mun-list'),s2=document.getElementById('p-mun-st');
    if(!u2||!d2||!s2||u2.value!==uf)return;
    d2.innerHTML=a.map(function(n){return '<option value="'+esc(n)+'"></option>';}).join('');
    s2.textContent=a.length+' municípios em '+uf+'. Escolha um da lista e o clima fica fixado nessa cidade.';
  }).catch(function(){
    var s3=document.getElementById('p-mun-st');if(s3)s3.textContent='Não consegui carregar a lista agora. Digite o nome do município.';
  });
}

document.addEventListener('submit',function(ev){
  var f=ev.target.closest&&ev.target.closest('form');if(!f||(f.dataset.form!=='prop'&&f.dataset.form!=='ed-prop'))return;
  var uf=val('p-uf'),mn=val('p-mun'),a=MUN[uf];
  if(!a||!mn)return;
  var key=nrm(mn),hit=a.filter(function(n){return nrm(n)===key;})[0];
  if(!hit){ev.preventDefault();ev.stopImmediatePropagation();fail('Escolha um município da lista de '+uf+'. Digite parte do nome e toque na sugestão.');return;}
  document.getElementById('p-mun').value=hit;
},true);
/* coordenadas: prefere a sede do município no estado escolhido */
function geoRank(r){var c=r.feature_code||'';return c==='PPLC'?5:c==='PPLA'?4:c==='PPLA2'?3:c==='PPLA3'?2:c.indexOf('PPL')===0?1:0;}
function geoOf(p){
  var k='atw-geo2:'+nrm(p.mun)+'|'+nrm(p.uf),c=lsGet(k);
  if(c)return Promise.resolve(c);
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(p.mun)+'&count=20&language=pt&country_code=BR').then(function(r){return r.json();}).then(function(j){
    var rs=j.results||[];if(!rs.length)throw new Error('Não encontrei o município "'+p.mun+'". Confira o nome na propriedade.');
    var st=nrm(UFN[String(p.uf||'').toUpperCase()]),inUf=rs.filter(function(r){return nrm(r.admin1)===st;}),
      exact=inUf.filter(function(r){return nrm(r.name)===nrm(p.mun);}),
      pool=exact.length?exact:inUf.length?inUf:rs;
    pool=pool.slice().sort(function(a,b){return geoRank(b)-geoRank(a)||(b.population||0)-(a.population||0);});

  }
  if(a==='eq-copy'){copyText(shareText(EQ.code),b);return;}
  if(a==='conv-ok'){S.convErr='';render();return;}
  if(b.dataset.eqRev){sb.rpc('revogar_convite',{p_codigo:b.dataset.eqRev}).then(function(){EQ.st='idle';render();});return;}
  if(b.dataset.eqRm){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Toque de novo para remover';return;}
    sb.rpc('remover_membro',{p_user:b.dataset.eqRm}).then(function(r){if(r.error){EQ.st='err';EQ.msg=eqErr(r.error);}else EQ.st='idle';render();});
  }
});
/* ---- aviso se o convite falhou ---- */
var _hv2=homeView;
homeView=function(){
  var h=_hv2();
  if(!S.convErr)return h;
  var n='<div class="exnote"><span class="pill warn">Convite</span><p>O código de convite não funcionou ('+esc(S.convErr)+'). Você está numa organização nova e vazia. Peça outro código ao dono.</p><button class="btn small" data-act="conv-ok">Entendi</button></div>';
  return h.replace(/(<span class="datechip">[^<]*<\/span><\/div>)/,'$1'+n);
};
var _render3=render;
render=function(){
  if(S.view==='equipe'&&me()){if(EQ.st==='idle')eqLoad();}else{EQ.st='idle';EQ.code=EQ.code;}
  _render3.apply(this,arguments);
  if(S.mode==='cadastro'&&S.conv&&S.convCode){var c=el('a-conv');if(c&&!c.value)c.value=S.convCode;}
};

init();

})();
</script>
