function parseDate(s){
  s=s.trim();var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}

document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form');if(!f)return;ev.preventDefault();
  var kind=f.dataset.form,D=mine();
  if(kind==='auth'){doAuth();return;}
  if(kind==='prop'){
    var nome=val('p-nome'),mun=val('p-mun'),uf=val('p-uf'),area=num(val('p-area'));
    if(nome.length<2)return fail('Informe o nome da propriedade.');
    if(mun.length<2)return fail('Informe o município.');
    if(!(area>0))return fail('Informe a área em hectares, maior que zero.');
    var np={id:uid(),nome:nome,mun:mun,uf:uf,area:area,talhoes:[]};D.props.push(np);save();
    S.form=null;S.msg='';S.pid=np.id;S.view='prop';render();return;
  }
  if(kind==='talhao'){
    var p=prop(S.pid),n=val('t-nome'),a=num(val('t-area'));
    if(n.length<1)return fail('Informe o nome do talhão.');
    if(!(a>0))return fail('Informe a área em hectares, maior que zero.');
    p.talhoes.push({id:uid(),nome:n,area:a,cultura:val('t-cult'),solo:val('t-solo'),plantio:val('t-plant'),criado:today(),atividades:[],leituras:[],ctrl:{on:false,alvo:30,max:240,vazao:4,ligado:false,acum:0}});
    S.form=null;S.msg='';changed();return;
  }
  if(kind==='leitura'){
    var t=talhao(prop(S.pid),S.tid),data=val('l-data'),u=num(val('l-umid')),phRaw=val('l-ph'),ph=phRaw===''?null:num(phRaw);
    if(!data)return fail('Informe a data da leitura.');
    if(!(u>=0&&u<=100))return fail('A umidade deve estar entre 0 e 100.');
    if(ph!==null&&!(ph>=3&&ph<=10))return fail('O pH deve estar entre 3 e 10.');
    t.leituras.push({id:uid(),data:data,ts:toDate(data).getTime(),umid:u,ph:ph,obs:val('l-obs'),fonte:'manual'});
    S.msg='';changed();return;
  }
  if(kind==='importar'){
    var tt=talhao(prop(S.pid),S.tid),lines=val('i-txt').split(/\n/),ok=0,bad=0;
    lines.forEach(function(ln){
      if(!ln.trim())return;
      var c=(ln.indexOf(';')>=0||ln.indexOf('\t')>=0)?ln.split(/[;\t]/):ln.split(',');
      var dt=parseDate(c[0]||''),um=num((c[1]||'').trim()),ph=(c[2]!=null&&c[2].trim()!=='')?num(c[2]):null;
      if(dt&&um>=0&&um<=100&&(ph===null||(ph>=3&&ph<=10))){tt.leituras.push({id:uid(),data:dt,ts:toDate(dt).getTime(),umid:um,ph:ph,obs:'importada',fonte:'importada'});ok++;}else bad++;
    });
    S.info=(ok?ok+' leitura(s) importada(s).':'')+(bad?' '+bad+' linha(s) ignorada(s) por formato inválido.':'');
    if(!ok&&!bad)S.info='Cole ao menos uma linha.';
    if(ok){changed();var em=document.getElementById('i-msg');if(em)em.className='good';}else{var e2=document.getElementById('i-msg');if(e2)e2.textContent=S.info;}
    return;
  }
  if(kind==='manejo'){
    var t3=talhao(prop(S.pid),S.tid),dm=val('m-data'),q=val('m-qtd'),c2=val('m-custo');
    if(!dm)return fail('Informe a data.');
    var qn=q===''?null:num(q),cn=c2===''?null:num(c2);
    if(qn!==null&&!(qn>=0))return fail('Quantidade inválida.');
    if(cn!==null&&!(cn>=0))return fail('Custo inválido.');
    t3.atividades.push({id:uid(),data:dm,tipo:val('m-tipo'),det:val('m-det'),qtd:qn,custo:cn});
    S.msg='';changed();return;
  }
  if(kind==='dev'){
    var sn=val('s-nome'),stid=val('s-t'),sprof=num(val('s-prof')),sint=num(val('s-int')),sseco=num(val('s-seco')),smol=num(val('s-mol'));
    if(sn.length<2)return fail('Dê um nome ao sensor.');
    if(!stid)return fail('Escolha o talhão.');
    if(!(sprof>0))return fail('Informe a profundidade em centímetros.');
    if(!(sint>0))return fail('Informe o intervalo de envio em minutos.');
    if(!(sseco>smol&&smol>=0))return fail('A leitura bruta no seco precisa ser maior que a da água.');
    var sr=findT(D,stid);
    var nd={id:uid(),nome:sn,tid:stid,pid:sr.p.id,modelo:val('s-m'),prof:sprof,intervalo:sint,seco:sseco,molhado:smol,key:newKey(),bateria:null,ultimo:0,ultimaUmid:null,sim:false,criado:Date.now()};
    D.devices.push(nd);S.form=null;S.msg='';S.devId=nd.id;evaluate();render();return;
  }
  if(kind==='teste'){
    var dv4=curDev(D);if(!dv4)return;
    var xv=val('x-val'),pl=val('x-tipo')==='raw'?{raw:Number(String(xv).replace(',','.'))}:{umid:Number(String(xv).replace(',','.'))};
    if(!xv||isNaN(pl.raw!=null?pl.raw:pl.umid)){S.info='Digite um número.';render();return;}
    pl.key=dv4.key;S.info='Enviando…';render();
    fetch(CFG.fnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)}).then(function(r){
      return r.text().then(function(t){var j={};try{j=JSON.parse(t);}catch(e){}return {st:r.status,j:j||{}};});
    }).then(function(o){
      var j=o.j;
      if(j.ok){S.info='Leitura recebida: umidade de '+br(j.umid)+'%.';render();return;}
      var why=j.error||j.message||j.msg||'';
      if(o.st===401||/jwt|authorization/i.test(why))why='o servidor exigiu login do aparelho. No Supabase, abra a função Ingest e desligue “Verify JWT”.';
      else if(o.st===404)why=why||'função não encontrada. Confira o endereço da função.';
      else if(o.st===429)why='muitos envios seguidos. Espere alguns segundos.';
      else if(!why)why='erro '+o.st+' sem detalhes.';
      S.info='Recusada: '+why;render();
    }).catch(function(){S.info='Não consegui falar com o servidor.';render();});
    return;
  }
  if(kind==='tarefa'){
    var tit=val('k-tit'),due=val('k-due'),tid=val('k-t');
    if(tit.length<2)return fail('Descreva a tarefa.');
    var x={id:uid(),auto:false,titulo:tit,due:due,done:false};
    if(tid){var r=findT(D,tid);if(r){x.pid=r.p.id;x.tid=tid;x.nome=r.t.nome+' · '+r.p.nome;}}
    D.tasks.push(x);save();S.form=null;S.msg='';render();return;
  }
});



/* ===== Fase 1: clima real, solo e recomendações (Open-Meteo, sem chave) ===== */
var CLIMA={},DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
var UFN={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
var KC={'Soja':[.4,1.15,.5],'Milho':[.4,1.2,.6],'Arroz':[1.05,1.2,.9],'Trigo':[.4,1.15,.4],'Feijão':[.4,1.15,.35]};
var KCN=['início do ciclo','pleno desenvolvimento','maturação'];
var SEMT={'Soja':20,'Milho':18,'Arroz':20,'Trigo':12,'Feijão':20};
function nrm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function wmo(c){return c===0?'Céu limpo':c<=2?'Poucas nuvens':c===3?'Nublado':c<=48?'Neblina':c<=57?'Garoa':c<=67?'Chuva':c<=77?'Frio intenso':c<=82?'Pancadas de chuva':'Tempestade';}
function geoOf(p){
  var k='atw-geo:'+nrm(p.mun)+'|'+nrm(p.uf),c=lsGet(k);
  if(c)return Promise.resolve(c);
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(p.mun)+'&count=10&language=pt&country_code=BR').then(function(r){return r.json();}).then(function(j){
    var rs=j.results||[];if(!rs.length)throw new Error('Não encontrei o município "'+p.mun+'". Confira o nome na propriedade.');
    var st=nrm(UFN[String(p.uf||'').toUpperCase()]),hit=rs.filter(function(r){return nrm(r.admin1)===st;})[0]||rs[0];
    var g={lat:hit.latitude,lon:hit.longitude,nome:hit.name};lsSet(k,g);return g;
  });
}
function fetchClima(p){
  return geoOf(p).then(function(g){
    var u='https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+'&timezone=auto&past_days=3&forecast_days=7'+
    '&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code'+
    '&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,soil_temperature_6cm,soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm,soil_moisture_27_to_81cm'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,et0_fao_evapotranspiration,wind_speed_10m_max';
    return fetch(u).then(function(r){if(!r.ok)throw new Error('O serviço de clima respondeu '+r.status+'.');return r.json();}).then(function(j){
      if(!j.daily||!j.hourly)throw new Error('Resposta do clima incompleta.');
      return {geo:g,cur:j.current,h:j.hourly,d:j.daily,at:Date.now()};
    });
  });
}
function loadClima(p){
  var c=CLIMA[p.id]||(CLIMA[p.id]={st:'idle'});
  if(c.busy)return;c.busy=true;if(!c.data)c.st='load';
  fetchClima(p).then(function(d){c.data=d;c.st='ok';c.msg='';lsSet('atw-clima:'+p.id,{data:d});})
  .catch(function(e){c.st=c.data?'ok':'err';c.msg='Sem conexão com o serviço de clima. Confira a internet e toque em Atualizar.';})
  .then(function(){c.busy=false;c.tried=Date.now();if((S.view==='clima'||S.view==='resumo')&&!isTyping())render();});
}
function climaOf(p){
  var c=CLIMA[p.id];
  if(!c){var ls=lsGet('atw-clima:'+p.id);c=CLIMA[p.id]=ls&&ls.data?{st:'ok',data:ls.data}:{st:'idle'};}
  var stale=c.data&&Date.now()-c.data.at>1800000;
  if(p.mun&&!c.busy&&(c.st==='idle'||stale||(c.st==='err'&&Date.now()-c.tried>60000)))loadClima(p);
  return c;
}
/* índices úteis */
function ix(cl){
  var d=cl.d,t=today(),di=d.time.indexOf(t);if(di<0)di=3;
  var hh=(cl.cur&&cl.cur.time||'').slice(0,13),hi=cl.h.time.findIndex(function(x){return x.slice(0,13)>=hh;});if(hi<0)hi=di*24;
  return {di:di,hi:hi};
}
function sum(a,i,n){var s=0;for(var k=i;k<i+n&&k<a.length;k++)s+=(a[k]||0);return s;}
function dayLbl(cl,di){var s=cl.d.time[di];return s?DSEM[toDate(s).getDay()]:'';}
function kcOf(t){
  var k=KC[t.cultura];if(!k||!t.plantio)return null;
  var dia=daysBetween(t.plantio,today()),f=dia/CICLO[t.cultura];if(f<0||f>1)return null;
  var e=f<.2?0:f<.75?1:2;return {kc:k[e],est:KCN[e]};
}
/* motor de recomendações: regras agronômicas propostas, validar com agrônomo */
function spray(cl,I){
  var h=cl.h,out=[];
  for(var i=0;i<h.time.length;i++){
    var w=h.wind_speed_10m[i],rh=h.relative_humidity_2m[i],t=h.temperature_2m[i],r=sum(h.precipitation,i,3);
    out.push(w>=3&&w<=10&&rh>=55&&t<=30&&r===0);
  }
  var best=null,s=-1;
  for(var j=I.hi;j<=Math.min(out.length,I.hi+48);j++){
    if(out[j]&&s<0)s=j;
    if((!out[j]||j===out.length)&&s>=0){if(!best||j-s>best.n)best={s:s,n:j-s};s=-1;}
  }
  if(best&&best.n<2)best=null;
  return {ok:out,best:best};
}
function recomendar(p,cl,d){
  var I=ix(cl),D=cl.d,H=cl.h,R=[],tal=[];
  p.talhoes.forEach(function(t){var k=kcOf(t);if(k)tal.push(k.kc);});
  var kc=tal.length?tal.reduce(function(a,b){return a+b;},0)/tal.length:1,
      r48=sum(D.precipitation_sum,I.di,2),r3=sum(D.precipitation_sum,I.di,3),et3=sum(D.et0_fao_evapotranspiration,I.di,3)*kc,def=et3-r3;
  if(r48>=12)R.push({n:'info',t:'Segure a irrigação',x:'Há '+br(r48,0)+' mm de chuva prevista em 48 h. Espere a chuva passar antes de irrigar.'});
  else if(def>=10)R.push({n:def>=20?'crit':'warn',t:'Irrigação recomendada',x:'Nos próximos 3 dias a lavoura deve perder cerca de '+br(et3,0)+' mm e a chuva prevista é de '+br(r3,0)+' mm. Déficit de ~'+br(def,0)+' mm (≈ '+br(def*10,0)+' m³ por hectare).'});
  else R.push({n:'ok',t:'Água em dia',x:'Chuva prevista ('+br(r3,0)+' mm) e demanda da cultura ('+br(et3,0)+' mm) estão equilibradas nos próximos 3 dias.'});
  var tmin=Infinity,td=0;for(var i=I.di;i<I.di+4&&i<D.time.length;i++){if(D.temperature_2m_min[i]<tmin){tmin=D.temperature_2m_min[i];td=i;}}
  if(tmin<=1)R.push({n:'crit',t:'Risco de geada',x:'Mínima de '+br(tmin,0)+' °C na '+dayLbl(cl,td)+'. Proteja culturas sensíveis e evite plantar ou aplicar nessa madrugada.'});
  else if(tmin<=3)R.push({n:'warn',t:'Frio intenso',x:'Mínima de '+br(tmin,0)+' °C na '+dayLbl(cl,td)+'. Fique atento à possibilidade de geada em baixadas.'});
  var tmax=-Infinity,xd=0;for(i=I.di;i<I.di+4&&i<D.time.length;i++){if(D.temperature_2m_max[i]>tmax){tmax=D.temperature_2m_max[i];xd=i;}}
  if(tmax>=35)R.push({n:'warn',t:'Calor forte',x:'Máxima de '+br(tmax,0)+' °C na '+dayLbl(cl,xd)+'. Há risco de estresse térmico e de maior demanda de água.'});
  var pm=0,pd=0;for(i=I.di;i<I.di+3&&i<D.time.length;i++){if(D.precipitation_sum[i]>pm){pm=D.precipitation_sum[i];pd=i;}}
  if(pm>=50)R.push({n:'warn',t:'Chuva muito forte',x:'Previsão de '+br(pm,0)+' mm na '+dayLbl(cl,pd)+'. Atenção a encharcamento e erosão nos talhões.'});
  var sp=spray(cl,I);
  if(sp.best){var s=sp.best.s,e=s+sp.best.n,dy=Math.floor(s/24)-I.di,hs=s%24,he=e%24;
    R.push({n:'info',t:'Janela de pulverização',x:'Melhor período nas próximas 48 h: '+(dy<=0?'hoje':dy===1?'amanhã':'em '+dy+' dias')+', das '+hs+'h às '+he+'h (vento entre 3 e 10 km/h, umidade acima de 55%, sem chuva).'});
  }else R.push({n:'warn',t:'Sem janela boa para pulverizar',x:'Nas próximas 48 h o vento, a umidade ou a chuva não ficam nos limites seguros. Adie a aplicação.'});
  var fh=0;for(i=I.hi;i<I.hi+72&&i<H.time.length;i++){if(H.relative_humidity_2m[i]>=90&&H.temperature_2m[i]>=18&&H.temperature_2m[i]<=30)fh++;}
  if(fh>=30)R.push({n:'warn',t:'Clima favorável a doenças',x:'Cerca de '+fh+' horas com umidade acima de 90% e temperatura entre 18 e 30 °C nos próximos 3 dias. Vistorie os talhões atrás de ferrugem e manchas foliares.'});
  var o={crit:0,warn:1,info:2,ok:3};R.sort(function(a,b){return o[a.n]-o[b.n];});
  return R;
}

/* ===== Fase 2: análise de solo, calagem e recomendações ===== */
var V2C={'Soja':60,'Milho':65,'Arroz':50,'Trigo':60,'Feijão':70,'Outra':60};
function fnum(x){return x==null||isNaN(x)?null:+x;}
function soloCalc(a,v2,prnt){
  var ca=fnum(a.ca),mg=fnum(a.mg),k=fnum(a.k),hal=fnum(a.hal),al=fnum(a.al),r={};
  if(ca!=null&&mg!=null&&k!=null){r.sb=ca+mg+k/391;}
  if(r.sb!=null&&hal!=null){r.ctc=r.sb+hal;r.v=r.ctc>0?r.sb/r.ctc*100:null;}
  if(al!=null&&r.sb!=null){var q=r.sb+al;r.m=q>0?al/q*100:null;}
  if(r.v!=null&&v2>0&&prnt>0){r.nc=Math.max(0,(v2-r.v)*r.ctc/prnt);}
  return r;
}
function soloLast(t){var s=(t.solos||[]).slice().sort(function(a,b){return a.data<b.data?1:-1;});return s[0]||null;}
function soloParams(t){return{v2:S.v2>0?S.v2:(V2C[t.cultura]||60),prnt:S.prnt>0?S.prnt:90};}
function soloRecs(t,a){
  var P=soloParams(t),c=soloCalc(a,P.v2,P.prnt),L=[],ph=fnum(a.ph);
  var meses=(Date.now()-new Date(a.data+'T12:00:00').getTime())/2629800000;
  if(meses>36)L.push({n:'info',t:'Análise com mais de 3 anos',x:'A análise é de '+fmtDate(a.data)+'. Repita a amostragem a cada 1 a 3 anos para acompanhar a fertilidade.'});
  if(ph!=null&&ph<5.5)L.push({n:'warn',t:'pH baixo (acidez)',x:'pH '+br(ph)+' em CaCl₂, abaixo da faixa de 5,5 a 6,5. A acidez reduz a absorção de nutrientes e prejudica as raízes.'});
  if(ph!=null&&ph>6.5)L.push({n:'info',t:'pH acima da faixa',x:'pH '+br(ph)+' em CaCl₂, acima de 6,5. Não aplique calcário e acompanhe micronutrientes como zinco e manganês.'});
  if(c.m!=null&&c.m>20)L.push({n:'warn',t:'Alumínio tóxico',x:'Saturação por alumínio de '+br(c.m)+'%, acima de 20%. A calagem corrige a camada arável; para o subsolo, peça avaliação de gessagem com análise de 20 a 40 cm.'});
  if(c.nc!=null){
    if(c.nc>0.2){
      var tot=c.nc*(t.area||0);
      L.push({n:c.v<P.v2-15?'crit':'warn',t:'Calagem: '+br(c.nc,1)+' t/ha',x:'Saturação por bases de '+br(c.v)+'%, para elevar a '+br(P.v2,0)+'% ('+t.cultura+'). Com PRNT '+br(P.prnt,0)+'%, são cerca de '+br(c.nc,1)+' t/ha'+(t.area?' e '+br(tot,1)+' t no talhão':'')+'. Aplique e incorpore com 60 a 90 dias de antecedência do plantio.'+(c.nc>5?' Dose acima de 5 t/ha costuma ser parcelada em duas aplicações.':'')});

  var td=today(),days=[],by={},i,mins=[];
  for(i=6;i>=0;i--){var dd=addDays(td,-i);var o={d:dd,v:[]};days.push(o);by[dd]=o;}
  d.props.forEach(function(p){p.talhoes.forEach(function(t){
    H.nt++;H.ha+=t.area||0;H.custo+=custos(t).custo;
    var l=lastRead(t),lim=limOf(t,d.rules),mx=d.rules.alta.val;
    if(l){H.rows.push({p:p,t:t,l:l,lim:lim,ok:l.umid>=lim&&l.umid<=mx,low:l.umid<lim});mins.push(lim);}
    t.leituras.forEach(function(x){var k=x.ts?iso(new Date(x.ts)):x.data;if(by[k])by[k].v.push(x.umid);});

/* ===== Fase 4: município escolhido da lista oficial (IBGE) e clima fixado na cidade ===== */
var MUN={};
function munList(uf){
  if(MUN[uf])return Promise.resolve(MUN[uf]);
  var c=lsGet('atw-mun:'+uf);if(c&&c.length>3){MUN[uf]=c;return Promise.resolve(c);}
  return fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/'+uf+'/municipios?orderBy=nome').then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(j){
    var a=j.map(function(m){return m.nome;}).filter(Boolean);if(!a.length)throw new Error('lista vazia');
    MUN[uf]=a;lsSet('atw-mun:'+uf,a);return a;
  });
}
function propForm(){
  return '<form class="card" data-form="prop" novalidate><h3>Nova propriedade</h3>'+
  '<label for="p-nome">Nome<input id="p-nome" placeholder="Ex.: Fazenda Boa Vista"></label>'+
  '<div class="grid2"><label for="p-uf">Estado<select id="p-uf">'+UFS.map(function(u){return '<option'+(u==='RS'?' selected':'')+'>'+u+'</option>';}).join('')+'</select></label>'+
  '<label for="p-mun">Município<input id="p-mun" list="p-mun-list" autocomplete="off" autocapitalize="words" placeholder="Digite para buscar"></label></div>'+
  '<datalist id="p-mun-list"></datalist><p class="mute" id="p-mun-st" style="font-size:12.5px;margin:-4px 0 12px">Escolha o estado e digite o município.</p>'+
  '<label for="p-area">Área total (hectares)<input id="p-area" inputmode="decimal" placeholder="Ex.: 120"></label>'+
  '<div class="err" role="alert">'+esc(S.msg)+'</div>'+
  '<div class="row"><button type="button" class="btn ghost" data-act="cancelar">Cancelar</button><button class="btn main" type="submit">Salvar propriedade</button></div></form>';
}
function mnFill(){
  var u=document.getElementById('p-uf'),dl=document.getElementById('p-mun-list'),st=document.getElementById('p-mun-st');if(!u||!dl||!st)return;
  var uf=u.value;
  if(!MUN[uf])st.textContent='Carregando os municípios de '+uf+'…';
  munList(uf).then(function(a){
    var u2=document.getElementById('p-uf'),d2=document.getElementById('p-mun-list'),s2=document.getElementById('p-mun-st');
    if(!u2||!d2||!s2||u2.value!==uf)return;
    d2.innerHTML=a.map(function(n){return '<option value="'+esc(n)+'"></option>';}).join('');
    s2.textContent=a.length+' municípios em '+uf+'. Escolha um da lista e o clima fica fixado nessa cidade.';
  }).catch(function(){
    var s3=document.getElementById('p-mun-st');if(s3)s3.textContent='Não consegui carregar a lista agora. Digite o nome do município.';
  });
}

document.addEventListener('submit',function(ev){
  var f=ev.target.closest&&ev.target.closest('form');if(!f||(f.dataset.form!=='prop'&&f.dataset.form!=='ed-prop'))return;
  var uf=val('p-uf'),mn=val('p-mun'),a=MUN[uf];
  if(!a||!mn)return;
  var key=nrm(mn),hit=a.filter(function(n){return nrm(n)===key;})[0];
  if(!hit){ev.preventDefault();ev.stopImmediatePropagation();fail('Escolha um município da lista de '+uf+'. Digite parte do nome e toque na sugestão.');return;}
  document.getElementById('p-mun').value=hit;
},true);
/* coordenadas: prefere a sede do município no estado escolhido */
function geoRank(r){var c=r.feature_code||'';return c==='PPLC'?5:c==='PPLA'?4:c==='PPLA2'?3:c==='PPLA3'?2:c.indexOf('PPL')===0?1:0;}
function geoOf(p){
  var k='atw-geo2:'+nrm(p.mun)+'|'+nrm(p.uf),c=lsGet(k);
  if(c)return Promise.resolve(c);
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(p.mun)+'&count=20&language=pt&country_code=BR').then(function(r){return r.json();}).then(function(j){
    var rs=j.results||[];if(!rs.length)throw new Error('Não encontrei o município "'+p.mun+'". Confira o nome na propriedade.');
    var st=nrm(UFN[String(p.uf||'').toUpperCase()]),inUf=rs.filter(function(r){return nrm(r.admin1)===st;}),
      exact=inUf.filter(function(r){return nrm(r.name)===nrm(p.mun);}),
      pool=exact.length?exact:inUf.length?inUf:rs;
    pool=pool.slice().sort(function(a,b){return geoRank(b)-geoRank(a)||(b.population||0)-(a.population||0);});

var TEC_P={'Soja':.5,'Milho':.55,'Trigo':.55,'Feijão':.45,'Arroz':.2,'Outra':.5};

  var min=arroz?s.sat*(1-p):s.fc-p*(s.fc-s.pmp);
  return {min:Math.round(min*10)/10,fc:s.fc,pmp:s.pmp,sat:s.sat,p:p,arroz:arroz};
}
function limOf(t,R){

'<h3>6. Uso aceitável</h3><p>É proibido: usar a plataforma para fins ilegais; tentar acessar dados de outras organizações; burlar limites ou mecanismos de segurança; enviar dados falsos de forma deliberada para prejudicar terceiros; copiar, revender ou fazer engenharia reversa do serviço, salvo o que a lei permitir; sobrecarregar a infraestrutura com envios automáticos abusivos.</p>'+

'<h3>9. Limitação de responsabilidade</h3><p>Na medida permitida pela lei, a AgroTwin não responde por perdas de safra, de produtividade ou financeiras decorrentes de decisões tomadas com base nas informações da plataforma, de falhas de sensores, de equipamentos ou de conexão, nem por lucros cessantes. Nada nestes Termos exclui direitos que a legislação de defesa do consumidor garanta a você. '+ph('revisão jurídica desta cláusula')+'</p>'+
'<h3>10. Planos e pagamento</h3><p>'+ph('descrever planos, preços, forma de cobrança, período de teste e cancelamento; enquanto não houver cobrança, indicar que o uso é gratuito durante a fase inicial')+'</p>'+
'<h3>11. Encerramento</h3><p>Você pode encerrar sua conta quando quiser. Podemos suspender ou encerrar contas que violem estes Termos ou a lei, avisando sempre que possível. Ao excluir a conta, os dados da organização são apagados, conforme a Política de Privacidade. O dono precisa remover as demais pessoas da equipe antes de excluir a conta.</p>'+

function findTal16(tid){var f=null;if(!D)return null;D.props.forEach(function(p){p.talhoes.forEach(function(t){if(t.id===tid)f={p:p,t:t};});});return f;}

/* modo 'srv': o servidor manda (evento ao vivo). modo 'dup': conflito de chave; mantém o que o usuário já dispensou/concluiu */
function mergeAlerta16(r,modo){
  if(!D||!r||!r.id)return false;
  var ex=snap.alertas&&snap.alertas[r.id];
  if(modo==='srv'&&ex&&ex===rowA16(r))return false;           // eco da nossa própria gravação
  var n=alertFrom16(r),a=D.alerts.filter(function(x){return x.id===r.id||(x.key&&x.key===r.chave);})[0],keep=false;
  if(a){keep=modo==='dup'&&a.dismissed&&!n.dismissed;a.id=n.id;a.key=n.key;a.sev=n.sev;a.msg=n.msg;a.tid=n.tid;a.pid=n.pid;a.dismissed=keep?true:n.dismissed;if(!a.nome)a.nome=n.nome;}
  else D.alerts.push(n);
  if(!keep)snapRow('alertas',n.id);
  return true;
}
function mergeTarefa16(r,modo){
  if(!D||!r||!r.id)return false;
  var ex=snap.tarefas&&snap.tarefas[r.id];
  if(modo==='srv'&&ex&&ex===rowT16(r))return false;
  var n=taskFrom16(r),a=D.tasks.filter(function(x){return x.id===r.id||(r.chave&&x.key===r.chave);})[0],keep=false;
  if(a){keep=modo==='dup'&&a.done&&!n.done;a.id=n.id;a.key=n.key;a.titulo=n.titulo;a.due=n.due;a.auto=n.auto;a.done=keep?true:n.done;if(!a.nome)a.nome=n.nome;}
  else D.tasks.push(n);
  if(!keep)snapRow('tarefas',n.id);
  return true;
}
function srvChange(tabela,ev,p){
  if(!D)return;
  var ch=false;
  if(ev==='DELETE'){
    var id=p.old&&p.old.id;if(!id)return;
    var L=tabela==='alertas'?D.alerts:D.tasks,i=L.map(function(x){return x.id;}).indexOf(id);
    if(i>=0){L.splice(i,1);ch=true;}
    if(snap[tabela])delete snap[tabela][id];
  }else ch=tabela==='alertas'?mergeAlerta16(p.new,'srv'):mergeTarefa16(p.new,'srv');
  if(ch){evaluate();if(typeof liveRefresh==='function')liveRefresh();if(!isTyping())render();}
}
subscribe=function(){
  if(chan){sb.removeChannel(chan);chan=null;}
  chan=sb.channel('org-'+ORG)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'leituras',filter:'org_id=eq.'+ORG},function(p){onLeitura(p.new);})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dispositivos',filter:'org_id=eq.'+ORG},function(p){onDevice(p.new);});
  ['alertas','tarefas'].forEach(function(t){
    chan=chan.on('postgres_changes',{event:'INSERT',schema:'public',table:t,filter:'org_id=eq.'+ORG},function(p){srvChange(t,'INSERT',p);})
             .on('postgres_changes',{event:'UPDATE',schema:'public',table:t,filter:'org_id=eq.'+ORG},function(p){srvChange(t,'UPDATE',p);})
             .on('postgres_changes',{event:'DELETE',schema:'public',table:t},function(p){srvChange(t,'DELETE',p);});
  });
  chan.subscribe();
};
/* se mesmo assim o banco recusar por chave repetida (servidor criou o mesmo alerta no mesmo instante),
   busca o que o servidor tem, junta com o que está na tela e grava de novo, sem perder o resto */
var dupBusy16=0,_ss16=setSync;
function dupRecover16(){
  if(dupBusy16||!D||!sb)return;dupBusy16=1;
  Promise.all(['alertas','tarefas'].map(function(t){return sb.from(t).select('*').eq('org_id',ORG).then(function(r){if(r.error)throw r.error;return r.data||[];});}))
  .then(function(a){
    a[0].forEach(function(r){mergeAlerta16(r,'dup');});a[1].forEach(function(r){mergeTarefa16(r,'dup');});
    evaluate();setSync('saving');return flush();
  }).then(function(){if(!isTyping())render();},function(e){_ss16('error',(e&&e.message)||String(e));})

function sketchNo18(dv){
  return ['#include <SPI.h>','#include <LoRa.h>','',
  '// Placa: Heltec WiFi LoRa 32 V2 ou TTGO LoRa32 (915 MHz)',
  'const char* CHAVE = "'+dv.key+'";',
  'const int   PINO_SENSOR   = 34;   // entrada analógica do sensor',
  'const uint64_t INTERVALO_MIN = '+dv.intervalo+';',
  'const bool CALIBRAR = false;      // true: mostra a leitura no Serial a cada 1 s',
  '',
  'void setup() {','  Serial.begin(115200);',
  '  if (CALIBRAR) { while (true) { Serial.println(analogRead(PINO_SENSOR)); delay(1000); } }',
  '  long soma = 0;','  for (int i = 0; i < 10; i++) { soma += analogRead(PINO_SENSOR); delay(20); }','  int raw = soma / 10;','',
  '  SPI.begin(5, 19, 27, 18);','  LoRa.setPins(18, 14, 26);',
  '  if (LoRa.begin(915E6)) {','    LoRa.setSpreadingFactor(10);   // mesmo valor no receptor','    LoRa.beginPacket();',
  '    LoRa.print(String("AT|") + CHAVE + "|" + raw + "|-1");','    LoRa.endPacket();','    LoRa.sleep();','  }','',
  '  esp_sleep_enable_timer_wakeup(INTERVALO_MIN * 60ULL * 1000000ULL);','  esp_deep_sleep_start();','}','','void loop() {}'].join('\n');
}
function sketchRx18(){
  return ['#include <WiFi.h>','#include <WiFiClientSecure.h>','#include <HTTPClient.h>','#include <SPI.h>','#include <LoRa.h>','',
  'const char* WIFI_SSID = "SUA_REDE";','const char* WIFI_PASS = "SUA_SENHA";',
  'const char* ENDPOINT  = "'+CFG.fnUrl+'";','',
  'void setup() {','  Serial.begin(115200);','  WiFi.begin(WIFI_SSID, WIFI_PASS);','  while (WiFi.status() != WL_CONNECTED) delay(300);',
  '  SPI.begin(5, 19, 27, 18);','  LoRa.setPins(18, 14, 26);','  while (!LoRa.begin(915E6)) delay(500);','  LoRa.setSpreadingFactor(10);   // igual ao sensor','  Serial.println("Receptor pronto");','}','',
  'void loop() {','  if (WiFi.status() != WL_CONNECTED) { WiFi.reconnect(); delay(2000); return; }',
  '  if (!LoRa.parsePacket()) { delay(10); return; }','  String p = "";','  while (LoRa.available()) p += (char)LoRa.read();',
  '  if (!p.startsWith("AT|")) return;','  int a = p.indexOf(\'|\', 3), b = p.indexOf(\'|\', a + 1);','  if (a < 0 || b < 0) return;',
  '  String key = p.substring(3, a), raw = p.substring(a + 1, b), bat = p.substring(b + 1);',
  '  String corpo = "{\\"key\\":\\"" + key + "\\",\\"raw\\":" + raw;','  if (bat.toInt() >= 0) corpo += ",\\"bat\\":" + bat;','  corpo += "}";',

  '  int st = http.POST(corpo); http.end();','  Serial.println(String("Enviado, resposta ") + st + " (RSSI " + LoRa.packetRssi() + ")");','}'].join('\n');
}

function m0_19(n){return 'R$ '+Math.round(n).toLocaleString('pt-BR');}
function st19(l){
  if(l.pago)return {t:(l.tipo==='pagar'?'Pago':'Recebido')+' em '+fmtDate(l.pago),c:''};
  var n=daysBetween(today(),l.venc);
  if(n<0)return {t:'Atrasado '+(-n)+(n===-1?' dia':' dias'),c:'late19'};
  if(n===0)return {t:'Vence hoje',c:'soon19'};
  return {t:'Vence '+fmtDate(l.venc)+' · em '+n+(n===1?' dia':' dias'),c:n<=7?'soon19':''};
}
function resumo19(L){
  var hoje=today(),lim=addDays(hoje,30),rec=0,pag=0,atr=0,prev=0;
  L.forEach(function(l){
    if(l.pago)return;
    if(l.tipo==='receber')rec+=l.valor;else pag+=l.valor;
    if(l.venc<hoje)atr+=l.valor;
    if(l.venc<=lim)prev+=(l.tipo==='receber'?l.valor:-l.valor);
  });
  return {rec:rec,pag:pag,atr:atr,prev:prev};
}
function meses19(L){
  var o=[],b=new Date();b=new Date(b.getFullYear(),b.getMonth(),1);
  var nm=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  for(var i=0;i<6;i++){var x=new Date(b.getFullYear(),b.getMonth()+i,1),k=x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2);
    var r=0,p=0;L.forEach(function(l){if(l.venc.slice(0,7)===k){if(l.tipo==='receber')r+=l.valor;else p+=l.valor;}});
    o.push({l:nm[x.getMonth()]+'/'+String(x.getFullYear()).slice(2),r:r,p:p});}
  return o;
}

document.addEventListener('submit',function(ev){
  var f=ev.target&&ev.target.closest?ev.target.closest('form'):null;if(!f)return;
  var k=f.dataset.form;if(k!=='mq21'&&k!=='hor21'&&k!=='man21')return;
  ev.preventDefault();ev.stopImmediatePropagation();
  function nn(id){var v=val(id);return v===''?null:num(v);}
  if(k==='mq21'){
    var nm=val('mq-nome');if(nm.length<2)return fail('Informe o nome da máquina.');
    var hr=nn('mq-hor')||0,rv=nn('mq-rev');
    if(!(hr>=0))return fail('Horímetro inválido.');if(rv!==null&&!(rv>=0))return fail('Intervalo de revisão inválido.');
    maq21().push({id:uid(),nome:nm,tipo:val('mq-tipo'),hor:hr,rev:rv||0,ult:hr,manut:[]});S.msg='';save();render();return;
  }
  var m=maq21().filter(function(x){return x.id===f.dataset.id;})[0];if(!m)return;
  if(k==='hor21'){
    var hv=nn('h-val');if(hv===null||!(hv>=0))return fail('Horímetro inválido.');
    if(hv<m.hor)return fail('O horímetro não pode diminuir (atual: '+h21(m.hor)+' h).');
    m.hor=hv;S.msg='';save();render();return;
  }
  var ds=val('mn-desc'),dt=val('mn-data'),cu=nn('mn-custo'),hh=nn('mn-hor');
  if(!dt)return fail('Informe a data.');if(ds.length<2)return fail('Descreva o que foi feito.');
  if(cu!==null&&!(cu>=0))return fail('Custo inválido.');if(hh!==null&&!(hh>=0))return fail('Horímetro inválido.');
  var rev=document.getElementById('mn-rev').checked,din=document.getElementById('mn-din').checked;
  if(din&&!(cu>0))return fail('Informe o custo para lançar a conta.');
  var hz=hh!==null?hh:m.hor;
  if(din){var dv=val('mn-venc');if(!dv)return fail('Informe o vencimento da conta.');lanc19().push({id:uid(),tipo:'pagar',desc:'Manutenção · '+m.nome+' · '+ds,cat:'Manutenção',cp:'',valor:cu,venc:dv,pago:''});}
  m.manut.push({id:uid(),data:dt,desc:ds,custo:cu,hor:hh});
  if(hh!==null&&hh>m.hor)m.hor=hh;
  if(rev)m.ult=hz;
  S.msg='';save();render();
},true);

function gmd23(l){
  var p=l.ev.filter(function(e){return e.tipo==='Pesagem'&&e.peso;}).sort(function(a,b){return a.data<b.data?-1:1;});
  if(p.length<2)return null;var a=p[p.length-2],b=p[p.length-1],n=daysBetween(a.data,b.data);
  return n>0?(b.peso-a.peso)/n:null;
}
function pend23(l){
  var r=[];l.ev.forEach(function(e){
    if(!e.prox||(e.tipo!=='Vacina'&&e.tipo!=='Tratamento'))return;
    var feito=l.ev.some(function(x){return x!==e&&x.tipo===e.tipo&&(x.obs||'').toLowerCase()===(e.obs||'').toLowerCase()&&x.data>e.data;});
    if(!feito)r.push({e:e,n:daysBetween(today(),e.prox)});
  });
  return r.sort(function(a,b){return a.n-b.n;});
}

  var ps2=on('peso')?nn('ev-peso'):null,cb2=on('cab')?nn('ev-cab'):null,vl=on('val')?nn('ev-val'):null,px=on('prox')?val('ev-prox'):'',ob=val('ev-obs');
  if(tp==='Pesagem'&&!(ps2>0))return fail('Informe o peso médio em kg.');
  if(on('cab')&&(!(cb2>0)||Math.round(cb2)!==cb2))return fail('Informe as cabeças (número inteiro maior que zero).');
  if(vl!==null&&!(vl>=0))return fail('Valor inválido.');
  if((tp==='Venda'||tp==='Morte')&&cb2>l.cab)return fail('Só há '+br(l.cab)+' cabeças neste lote.');
  if(px&&px<=dt)return fail('A próxima dose precisa ser depois da data.');
  var din=document.getElementById('ev-din'),mk=null;
  if(on('din')&&din&&din.checked){
    if(!(vl>0))return fail('Informe o valor para lançar em Dinheiro.');
    var dv=val('ev-venc');if(!dv)return fail('Informe o vencimento da conta.');
    mk={id:uid(),tipo:tp==='Venda'?'receber':'pagar',desc:tp+' · '+l.nome+(ob?' · '+ob:''),cat:tp==='Venda'?'Venda de animais':'Outro',cp:'',valor:vl,venc:dv,pago:''};
  }
  if(mk)lanc19().push(mk);
  l.ev.push({id:uid(),tipo:tp,data:dt,cab:cb2,peso:ps2,valor:vl,obs:ob,prox:px});
  if(tp==='Pesagem')l.peso=ps2;
  if(tp==='Compra')l.cab+=cb2;
  if(tp==='Venda'||tp==='Morte')l.cab-=cb2;
  S.msg='';save();render();
},true);

function cont24(d){
  var hoje=today(),lim=addDays(hoje,3),atr=0,vatr=0,pr=0,v3=0,mq=[],mqs=[],est=[],vac=[],vacs=[];
  (d.lanc||[]).forEach(function(l){if(l.pago)return;if(l.venc<hoje){atr++;vatr+=l.valor;}else if(l.venc<=lim)pr++;});
  (d.estoque||[]).forEach(function(i){if(baixo20(i))est.push(i.nome);});
  (d.maq||[]).forEach(function(m){var s=stm21(m);if(s.n<0)mq.push(m.nome);else if(s.n<=50)mqs.push(m.nome);});
  (d.lotes||[]).forEach(function(l){var p=pend23(l);if(p.some(function(x){return x.n<0;}))vac.push(l.nome);else if(p.some(function(x){return x.n<=7;}))vacs.push(l.nome);});
  return {atr:atr,vatr:vatr,pr:pr,est:est,mq:mq,mqs:mqs,vac:vac,vacs:vacs};
}
function att24(d,H){
  var C=cont24(d),a=[],b=[],c=[];
  H.al.slice().sort(function(x,y){return sevN(y.sev)-sevN(x.sev);}).forEach(function(x){var it={k:x.sev==='crit'?'crit':'warn',b:x.nome||x.msg,s:x.nome?x.msg:'',e:x.sev==='crit'?'Urgente':'Atenção',g:'alertas'};(x.sev==='crit'?a:b).push(it);});
  if(C.atr)a.push({k:'crit',b:C.atr+(C.atr>1?' contas atrasadas':' conta atrasada'),s:money(C.vatr)+' em aberto',e:'Dinheiro',g:'dinheiro'});
  if(C.mq.length)a.push({k:'crit',b:'Revisão vencida',s:C.mq.join(', '),e:'Máquinas',g:'maquinas'});
  if(C.vac.length)a.push({k:'crit',b:'Vacina ou tratamento atrasado',s:C.vac.join(', '),e:'Pecuária',g:'pecuaria'});
  if(C.pr)b.push({k:'warn',b:C.pr+(C.pr>1?' contas vencem':' conta vence')+' em até 3 dias',s:'',e:'Dinheiro',g:'dinheiro'});
  if(C.est.length)b.push({k:'warn',b:'Estoque baixo',s:C.est.join(', '),e:'Estoque',g:'estoque'});
  if(C.mqs.length)b.push({k:'warn',b:'Revisão chegando',s:C.mqs.join(', '),e:'Máquinas',g:'maquinas'});
  if(C.vacs.length)b.push({k:'warn',b:'Vacina nos próximos 7 dias',s:C.vacs.join(', '),e:'Pecuária',g:'pecuaria'});
  H.tk.slice().sort(function(x,y){return (x.due||'9')<(y.due||'9')?-1:1;}).forEach(function(t){c.push({k:'task',b:t.titulo,s:t.nome||'',e:t.due?fmtDate(t.due):'sem data',g:'tarefas'});});
  return a.concat(b,c);
}
function atencao24(d,H){
  var it=att24(d,H),n=it.length,crit=it.filter(function(x){return x.k==='crit';}).length,all=!!S.att24,vis=all?it:it.slice(0,3);

  return h+'</div>'+(n>3?'<button class="btn small ghost" data-att24="1">'+(all?'Mostrar menos':'Ver tudo ('+n+')')+'</button>':'')+'</div>';
}
