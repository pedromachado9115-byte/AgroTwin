<style>
/* Layout: app de uma coluna, barra de abas fixa embaixo (Resumo, Alertas, Tarefas, Áreas, Regras). Claro por padrão, escuro pelo sistema. */
:root{

.bars{display:grid;gap:12px}
.bar{display:grid;gap:5px}
.bar-h{display:flex;justify-content:space-between;gap:10px;font-size:13px}

.tk.done .tk-t{text-decoration:line-through;color:var(--mute)}
.tk-b{min-width:0;flex:1}
.tk-t{font-weight:500;overflow-wrap:anywhere}
.tk small{color:var(--mute)}
.late{color:var(--bad)}
.rule{display:grid;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.rule-h{display:flex;gap:12px;align-items:flex-start}

.cyc{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.cyc i{display:block;height:100%;background:var(--accent)}
.live-v{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:-.02em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:8px}

pre.term{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font:12px/1.5 var(--mono);margin:0;white-space:pre;color:var(--fg)}
.logl{display:grid;gap:8px}.logi{display:flex;gap:10px;font-size:13.5px;align-items:flex-start}.logi time{font-family:var(--mono);color:var(--mute);font-size:11.5px;flex:none;padding-top:2px}
.wbars{display:flex;align-items:flex-end;gap:8px;height:90px}.wb{flex:1;display:grid;gap:4px;justify-items:center;align-content:end;height:100%}.wb i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--water);min-height:2px}.wb span{font-size:10.5px;color:var(--mute);font-family:var(--mono)}

function findT(d,tid){for(var i=0;i<d.props.length;i++){var t=talhao(d.props[i],tid);if(t)return {p:d.props[i],t:t};}return null;}

/* ---------- motor de automação ---------- */
function evaluate(){
  var d=mine();if(!d)return;
  d.props.forEach(function(p){p.talhoes.forEach(function(t){if(!t.ctrl)t.ctrl={on:false,alvo:30,max:240,vazao:4,ligado:false,acum:0};if(!t.atividades)t.atividades=[];});});
  var R=d.rules,wa={},wt={},td=today();
  d.props.forEach(function(p){p.talhoes.forEach(function(t){
    var ls=dailyL(t),last=ls[ls.length-1],nm=t.nome+' · '+p.nome;
    function A(key,sev,msg){wa[key]={key:key,pid:p.id,tid:t.id,sev:sev,msg:msg,nome:nm};}
    function T(key,titulo,due){wt[key]={key:key,auto:true,pid:p.id,tid:t.id,titulo:titulo,due:due,nome:nm};}
    if(R.baixa.on&&last&&!rainRecent(t,R)){
      var lim=R.baixa.lim[t.solo];
      if(last.umid<lim){
        A('baixa:'+t.id,last.umid<lim-5?'crit':'warn','Umidade em '+br(last.umid)+'% em '+fmtDate(last.data)+', abaixo do mínimo de '+br(lim)+'% para solo '+t.solo.toLowerCase()+'.');
        if(R.baixa.tarefa)T('irrigar:'+t.id+':'+last.data,'Irrigar '+t.nome,td);
      }
    }
    if(R.alta.on&&last&&last.umid>R.alta.val)A('alta:'+t.id,'warn','Umidade em '+br(last.umid)+'%, acima de '+br(R.alta.val)+'%. Risco de encharcamento.');
    if(R.ph.on&&last&&last.ph!=null&&(last.ph<R.ph.min||last.ph>R.ph.max))A('ph:'+t.id,'warn','pH '+br(last.ph)+' fora da faixa de '+br(R.ph.min)+' a '+br(R.ph.max)+'.');
    if(R.queda.on&&ls.length>=2){
      var pv=ls[ls.length-2];
      if(pv.umid-last.umid>=R.queda.val&&daysBetween(pv.data,last.data)<=3)A('queda:'+t.id,'info','Umidade caiu '+br(pv.umid-last.umid)+' pontos em '+daysBetween(pv.data,last.data)+' dia(s).');
    }
    if(R.semleit.on){
      var ref=last?last.data:t.criado,dias=daysBetween(ref,td);
      if(dias>=R.semleit.dias)A('semleit:'+t.id,'warn',(last?'Última leitura há '+dias+' dias.':'Nenhuma leitura registrada há '+dias+' dias.'));
    }
    if(R.colheita.on&&t.plantio&&CICLO[t.cultura]){
      var fim=addDays(t.plantio,CICLO[t.cultura]),rest=daysBetween(td,fim);
      if(rest<=R.colheita.dias&&rest>=-30&&!t.atividades.some(function(a){return a.tipo==='Colheita';}))T('colheita:'+t.id,'Planejar colheita de '+t.nome,fim);
    }
  });});
  d.devices=d.devices.filter(function(v){return findT(d,v.tid);});
  d.devices.forEach(function(v){
    var r=findT(d,v.tid),nm=v.nome+' · '+r.t.nome;
    function A2(key,sev,msg){wa[key]={key:key,pid:r.p.id,tid:r.t.id,sev:sev,msg:msg,nome:nm};}
    if(R.offline.on&&!v.sim){
      var ref=v.ultimo||v.criado;
      if(Date.now()-ref>3*v.intervalo*60000)A2('offline:'+v.id,'crit',v.ultimo?'Sem comunicação '+ago(v.ultimo)+'. Esperado a cada '+v.intervalo+' min.':'Nenhuma leitura recebida ainda. Confira energia e rede do aparelho.');
    }
    if(R.bateria.on&&v.bateria!=null&&v.bateria<R.bateria.val)A2('bat:'+v.id,'warn','Bateria em '+br(v.bateria,0)+'%. Troque ou recarregue em breve.');
  });
  var prev={};d.alerts.forEach(function(a){prev[a.key]=a;});
  var next=[];
  Object.keys(wa).forEach(function(k){
    var w=wa[k],o=prev[k];
    if(o){o.msg=w.msg;o.sev=w.sev;o.nome=w.nome;next.push(o);}
    else{w.id=uid();w.created=td;w.dismissed=false;next.push(w);}
  });
  d.alerts=next;
  var pt={};d.tasks.forEach(function(t){if(t.key)pt[t.key]=t;});
  var nt=d.tasks.filter(function(t){return !t.auto||t.done||wt[t.key];});
  Object.keys(wt).forEach(function(k){if(!pt[k]){var w=wt[k];w.id=uid();w.done=false;nt.push(w);}else{pt[k].due=wt[k].due;}});
  d.tasks=nt;
  save();
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function el(id){return document.getElementById(id);}
function rainRecent(t,R){return t.atividades.some(function(a){return a.tipo==='Chuva'&&a.qtd>=R.chuva.mm&&daysBetween(a.data,today())<=1;});}
function logEv(msg,tid){var d=mine();d.log.unshift({id:uid(),ts:Date.now(),msg:msg,tid:tid||null});if(d.log.length>60)d.log.length=60;}
function ago(ts){if(!ts)return 'nunca';var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';var h=Math.round(m/60);if(h<48)return 'há '+h+' h';return 'há '+Math.round(h/24)+' dias';}
function stamp(ts){var x=new Date(ts);return pad(x.getDate())+'/'+pad(x.getMonth()+1)+' '+pad(x.getHours())+':'+pad(x.getMinutes());}
function newKey(){var c='abcdefghijklmnopqrstuvwxyz0123456789',s='atw_';for(var i=0;i<20;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s;}
function devStatus(dv){
  if(dv.sim)return {k:'sim',l:'simulado'};
  if(!dv.ultimo)return {k:'wait',l:'aguardando'};
  return (Date.now()-dv.ultimo)>3*dv.intervalo*60000?{k:'off',l:'offline'}:{k:'on',l:'online'};
}
function curDev(d){return d.devices.filter(function(x){return x.id===S.devId;})[0]||null;}

/* Recebe uma leitura de um dispositivo. É a mesma função que o servidor vai chamar quando o endereço de envio existir. */


function ctrlStep(t,u,dt){
  var c=t.ctrl,R=mine().rules,lim=R.baixa.lim[t.solo];
  if(c.ligado){
    c.acum=(c.acum||0)+dt;
    if(c.acum>=c.max)stopValve(t,'tempo máximo de '+br(c.max,0)+' min',false);
    else if(c.on&&u>=c.alvo)stopValve(t,'umidade-alvo de '+br(c.alvo)+'% atingida',false);
  }else if(c.on&&u<lim){
    if(rainRecent(t,R)){
      if(!c.pausaLog){c.pausaLog=true;logEv('Irrigação de '+t.nome+' em pausa: choveu o suficiente nas últimas 24 h.',t.id);}
    }else{
      c.ligado=true;c.acum=0;c.pausaLog=false;
      logEv('Irrigação ligada em '+t.nome+': umidade em '+br(u)+'%, mínimo de '+br(lim)+'%.',t.id);
    }
  }
  if(u>=lim)c.pausaLog=false;
}
function stopValve(t,why,manual){
  var c=t.ctrl,mm=Math.round(c.vazao*(c.acum||0)/60*10)/10;
  c.ligado=false;
  if(mm>0)t.atividades.push({id:uid(),data:today(),tipo:'Irrigação',det:manual?'Manual pelo painel':'Automática',qtd:mm,custo:null,auto:!manual});
  logEv('Irrigação desligada em '+t.nome+' ('+why+'). Aplicados cerca de '+br(mm)+' mm.',t.id);
  c.acum=0;
}

function waterCard(d){
  var days=[],tot=0,i;

}

  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
}

function authMsg(e){
  var m=(e&&e.message)||'';
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use Entrar.';
  if(/not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Espere alguns minutos.';
  return 'Não deu certo: '+m;
}

/* modelo do app <-> linhas do banco */
function seriesOf(t){return sortedL(t).filter(function(l){return l.fonte==='sensor';}).slice(-60).map(function(l){return l.umid;});}
function dailyL(t){var m={},o=[];sortedL(t).forEach(function(l){m[l.data]=l;});Object.keys(m).sort().forEach(function(k){o.push(m[k]);});return o;}
function leituraFrom(r){var ts=Date.parse(r.medido_em);return {id:r.id,ts:ts,data:iso(new Date(ts)),umid:+r.umidade,ph:r.ph==null?null:+r.ph,obs:r.obs||'',fonte:r.fonte,dev:r.dispositivo_id||null};}
function mergeRules(cfg){
  var d=DEF_RULES();cfg=cfg||{};
  Object.keys(d).forEach(function(k){
    if(!cfg[k])return;
    Object.keys(cfg[k]).forEach(function(f){
      if(f==='lim'&&d[k].lim){Object.keys(cfg[k].lim).forEach(function(s){d[k].lim[s]=cfg[k].lim[s];});}
      else d[k][f]=cfg[k][f];
    });
  });
  return d;
}
function buildD(res){
  var d={props:[],alerts:[],tasks:[],devices:[],log:[],rules:mergeRules(res.regras[0]&&res.regras[0].config),noRules:!res.regras.length},pm={},tm={};
  res.propriedades.forEach(function(r){var p={id:r.id,nome:r.nome,mun:r.municipio,uf:r.uf,area:+r.area_ha,talhoes:[]};pm[r.id]=p;d.props.push(p);});
  res.talhoes.forEach(function(r){
    var p=pm[r.propriedade_id];if(!p)return;
    var t={id:r.id,nome:r.nome,area:+r.area_ha,cultura:r.cultura,solo:r.solo,plantio:r.plantio||'',criado:iso(new Date(r.criado_em)),leituras:[],atividades:[],
      ctrl:Object.assign({on:false,alvo:30,max:240,vazao:4,ligado:false,acum:0},r.irrigacao||{})};
    p.talhoes.push(t);tm[r.id]={t:t,p:p};
  });
  res.leituras.forEach(function(r){var x=tm[r.talhao_id];if(!x||r.umidade==null)return;x.t.leituras.push(leituraFrom(r));});
  res.manejos.forEach(function(r){var x=tm[r.talhao_id];if(!x)return;x.t.atividades.push({id:r.id,data:r.data,tipo:r.tipo,det:r.detalhe||'',qtd:r.quantidade==null?null:+r.quantidade,custo:r.custo==null?null:+r.custo,auto:!!r.automatico});});
  res.dispositivos.forEach(function(r){d.devices.push({id:r.id,nome:r.nome,tid:r.talhao_id,pid:tm[r.talhao_id]?tm[r.talhao_id].p.id:null,modelo:r.modelo,prof:+r.prof_cm,intervalo:+r.intervalo_min,seco:+r.bruto_seco,molhado:+r.bruto_agua,key:r.chave,bateria:r.bateria==null?null:+r.bateria,ultimo:r.ultimo_envio?Date.parse(r.ultimo_envio):0,criado:Date.parse(r.criado_em)});});
  res.alertas.forEach(function(r){var x=tm[r.talhao_id];d.alerts.push({id:r.id,key:r.chave,tid:r.talhao_id,pid:x?x.p.id:null,nome:x?x.t.nome+' · '+x.p.nome:'',sev:r.severidade,msg:r.mensagem,dismissed:!!r.dispensado,created:iso(new Date(r.criado_em))});});
  res.tarefas.forEach(function(r){var x=tm[r.talhao_id];d.tasks.push({id:r.id,key:r.chave||null,auto:!!r.automatica,pid:x?x.p.id:null,tid:r.talhao_id||null,titulo:r.titulo,due:r.vencimento||'',done:!!r.concluida,nome:x?x.t.nome+' · '+x.p.nome:''});});
  res.log_sistema.forEach(function(r){d.log.push({id:r.id,ts:Date.parse(r.criado_em),msg:r.mensagem,tid:r.talhao_id||null});});
  return d;
}
function toRows(){
  var R={},tids={};TABLES.forEach(function(t){R[t]={};});
  D.props.forEach(function(p){p.talhoes.forEach(function(t){tids[t.id]=1;});});
  function vt(x){return x&&tids[x]?x:null;}
  R.regras[ORG]={org_id:ORG,config:D.rules};
  D.props.forEach(function(p){
    R.propriedades[p.id]={id:p.id,org_id:ORG,nome:p.nome,municipio:p.mun,uf:p.uf,area_ha:p.area};
    p.talhoes.forEach(function(t){
      R.talhoes[t.id]={id:t.id,org_id:ORG,propriedade_id:p.id,nome:t.nome,area_ha:t.area,cultura:t.cultura,solo:t.solo,plantio:t.plantio||null,irrigacao:t.ctrl};
      t.leituras.forEach(function(l){R.leituras[l.id]={id:l.id,org_id:ORG,talhao_id:t.id,dispositivo_id:l.dev||null,medido_em:new Date(l.ts).toISOString(),umidade:l.umid,ph:l.ph==null?null:l.ph,fonte:l.fonte||'manual',obs:l.obs||null};});
      t.atividades.forEach(function(a){R.manejos[a.id]={id:a.id,org_id:ORG,talhao_id:t.id,data:a.data,tipo:a.tipo,detalhe:a.det||null,quantidade:a.qtd==null?null:a.qtd,custo:a.custo==null?null:a.custo,automatico:!!a.auto};});
    });
  });
  D.devices.forEach(function(v){R.dispositivos[v.id]={id:v.id,org_id:ORG,talhao_id:v.tid,nome:v.nome,modelo:v.modelo,prof_cm:v.prof,intervalo_min:v.intervalo,bruto_seco:v.seco,bruto_agua:v.molhado,chave:v.key,bateria:v.bateria==null?null:v.bateria,ultimo_envio:v.ultimo?new Date(v.ultimo).toISOString():null};});
  D.alerts.forEach(function(a){R.alertas[a.id]={id:a.id,org_id:ORG,talhao_id:vt(a.tid),chave:a.key,severidade:a.sev,mensagem:a.msg,dispensado:!!a.dismissed};});
  D.tasks.forEach(function(x){R.tarefas[x.id]={id:x.id,org_id:ORG,talhao_id:vt(x.tid),chave:x.key||null,titulo:x.titulo,vencimento:x.due||null,concluida:!!x.done,automatica:!!x.auto};});
  D.log.forEach(function(e){R.log_sistema[e.id]={id:e.id,org_id:ORG,talhao_id:vt(e.tid),mensagem:e.msg,criado_em:new Date(e.ts).toISOString()};});
  return R;
}
function baseline(){
  snap={};var R=toRows();
  TABLES.forEach(function(t){snap[t]={};Object.keys(R[t]).forEach(function(k){snap[t][k]=JSON.stringify(R[t][k]);});});
  if(D.noRules)delete snap.regras[ORG];
}
function devU(dv,d){var r=findT(d,dv.tid),s=r?seriesOf(r.t):[];return s.length?s[s.length-1]:null;}
function snapRow(table,id){var R=toRows();if(R[table][id])snap[table][id]=JSON.stringify(R[table][id]);}

/* gravação: compara o estado atual com o último gravado e envia só o que mudou */
function save(){if(!D||!sb)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(flush,600);}
function flush(){
  if(!D||!sb)return Promise.resolve();
  if(syncing){dirty=true;return Promise.resolve();}
  var R=toRows(),ups={},dels={},n=0;
  TABLES.forEach(function(t){
    var old=snap[t]||(snap[t]={});ups[t]=[];dels[t]=[];
    Object.keys(R[t]).forEach(function(k){var js=JSON.stringify(R[t][k]);if(old[k]!==js){ups[t].push({row:R[t][k],js:js,k:k});n++;}});
    Object.keys(old).forEach(function(k){if(!R[t][k]){dels[t].push(k);n++;}});
  });
  if(!n){if(S.sync!=='ok')setSync('ok');return Promise.resolve();}
  syncing=true;dirty=false;setSync('saving');
  var chain=Promise.resolve();
  TABLES.forEach(function(t){
    if(!ups[t].length)return;
    chain=chain.then(function(){return sb.from(t).upsert(ups[t].map(function(x){return x.row;})).then(function(r){if(r.error)throw r.error;ups[t].forEach(function(x){snap[t][x.k]=x.js;});});});
  });
  TABLES.slice().reverse().forEach(function(t){
    if(!dels[t].length)return;
    chain=chain.then(function(){return sb.from(t).delete().in(PK[t]||'id',dels[t]).then(function(r){if(r.error)throw r.error;dels[t].forEach(function(k){delete snap[t][k];});});});
  });
  return chain.then(function(){syncing=false;setSync('ok');if(dirty)flush();},function(e){syncing=false;setSync('error',(e&&e.message)||String(e));});
}

/* tempo real: leituras novas dos sensores e estado dos dispositivos */
function onLeitura(r){
  if(!D||r.umidade==null)return;
  var f=null;D.props.forEach(function(p){p.talhoes.forEach(function(t){if(t.id===r.talhao_id)f=t;});});
  if(!f||f.leituras.some(function(l){return l.id===r.id;}))return;
  var prev=sortedL(f).filter(function(l){return l.fonte==='sensor';}).pop();
  var l=leituraFrom(r);f.leituras.push(l);snapRow('leituras',l.id);
  if(r.dispositivo_id&&f.ctrl)ctrlStep(f,l.umid,prev?clamp((l.ts-prev.ts)/60000,0,180):0);
  evaluate();liveRefresh();
}
function onDevice(r){
  if(!D)return;
  var v=D.devices.filter(function(x){return x.id===r.id;})[0];if(!v)return;
  v.ultimo=r.ultimo_envio?Date.parse(r.ultimo_envio):0;v.bateria=r.bateria==null?null:+r.bateria;
  snapRow('dispositivos',v.id);liveRefresh();
}
function subscribe(){
  if(chan){sb.removeChannel(chan);chan=null;}
  chan=sb.channel('org-'+ORG)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'leituras',filter:'org_id=eq.'+ORG},function(p){onLeitura(p.new);})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dispositivos',filter:'org_id=eq.'+ORG},function(p){onDevice(p.new);})
    .subscribe();
}

function loadAll(){
  var jobs=TABLES.map(function(t){
    var s=sb.from(t).select('*').eq('org_id',ORG);
    if(t==='leituras')s=s.order('medido_em',{ascending:false}).limit(3000);
    if(t==='log_sistema')s=s.order('criado_em',{ascending:false}).limit(60);
    return s.then(function(r){if(r.error)throw r.error;return r.data||[];});
  });
  return Promise.all(jobs).then(function(arr){var res={};TABLES.forEach(function(t,i){res[t]=arr[i];});return buildD(res);});
}
function reload(){
  if(!D||!sb)return Promise.resolve();
  return flush().then(function(){return loadAll();}).then(function(nd){D=nd;baseline();evaluate();if(!isTyping())render();}).catch(function(e){setSync('error',(e&&e.message)||String(e));});
}
function boot(session){
  S.loading=true;S.fatal='';render();
  var u=session.user,meta=u.user_metadata||{},orgName='';
  sb.from('membros').select('org_id,papel').limit(1).then(function(m){
    if(m.error)throw m.error;
    if(m.data&&m.data[0])return m.data[0].org_id;
    return sb.rpc('criar_organizacao',{p_nome:meta.org||'Minha organização',p_tipo:meta.perfil==='cooperativa'?'cooperativa':'produtor'}).then(function(r){if(r.error)throw r.error;return r.data;});
  }).then(function(orgId){
    ORG=orgId;
    return sb.from('organizacoes').select('nome,tipo').eq('id',orgId).single();
  }).then(function(o){
    if(o.error)throw o.error;
    PROFILE={id:u.id,email:u.email,nome:meta.nome||'',org:o.data.nome,perfil:o.data.tipo};
    return loadAll();
  }).then(function(nd){
    D=nd;baseline();subscribe();S.loading=false;S.view='resumo';S.sync='ok';evaluate();render();
  }).catch(function(e){
    S.loading=false;PROFILE=null;D=null;S.fatal='Não consegui carregar seus dados: '+((e&&e.message)||e);render();
  });
}
function signedOut(){
  if(chan&&sb){sb.removeChannel(chan);chan=null;}
  PROFILE=null;D=null;ORG=null;snap={};S.view='resumo';S.pid=S.tid=null;S.mode='entrar';S.loading=false;S.fatal='';S.msg='';
  location.hash='#entrar';render();
}
function doAuth(){
  var cad=S.mode==='cadastro',email=val('a-email').toLowerCase(),pass=el('a-pass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Digite um e-mail válido.');
  var btn=document.querySelector('#f-auth button[type=submit]');
  function done(){if(btn)btn.disabled=false;}
  if(cad){
    var nome=val('a-nome'),org=val('a-org');
    if(nome.length<2)return fail('Informe seu nome.');
    if(org.length<2)return fail('Informe o nome da propriedade ou da organização.');
    if(pass.length<8)return fail('A senha precisa ter pelo menos 8 caracteres.');
    if(btn)btn.disabled=true;
    sb.auth.signUp({email:email,password:pass,options:{data:{nome:nome,org:org,perfil:S.who}}}).then(function(r){
      done();
      if(r.error)return fail(authMsg(r.error));
      if(!r.data.session){S.mode='entrar';S.msg='';S.info='Conta criada. Abra o e-mail de confirmação e depois entre.';location.hash='#entrar';render();}
    });
  }else{
    if(!pass)return fail('Digite a senha.');
    if(btn)btn.disabled=true;
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){done();if(r.error)return fail(authMsg(r.error));});
  }
}
function init(){
  if(!window.supabase||!CFG.url){S.fatal='Não consegui carregar a biblioteca do banco de dados. Confira a internet e recarregue.';render();return;}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  S.loading=true;render();
  sb.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      if(session&&session.user){
        if(PROFILE&&PROFILE.id===session.user.id)return;
        if(S.loading&&S.booting)return;
        S.booting=true;boot(session);
      }else if(ev==='SIGNED_OUT'||ev==='INITIAL_SESSION'){
        S.booting=false;if(PROFILE||ev==='SIGNED_OUT')signedOut();else{S.loading=false;route();render();}
      }
    },0);
  });
  setInterval(function(){if(D){evaluate();liveRefresh();}},30000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reload();});
}

/* ---------- ciclo e manejo ---------- */
function ciclo(t){
  if(!t.plantio||!CICLO[t.cultura])return null;
  var tot=CICLO[t.cultura],dia=daysBetween(t.plantio,today()),fim=addDays(t.plantio,tot);
  var f=dia/tot,est=dia<0?'Plantio previsto':f<.35?'Emergência e crescimento':f<.6?'Floração':f<.85?'Enchimento de grãos':f<1?'Maturação':'Pronto para colher';
  return {tot:tot,dia:dia,fim:fim,est:est,pct:Math.max(0,Math.min(100,f*100))};
}
function custos(t){
  var c=0,sacas=0;t.atividades.forEach(function(a){if(a.custo)c+=a.custo;if(a.tipo==='Colheita'&&a.qtd)sacas+=a.qtd;});
  return {custo:c,sacas:sacas,porHa:t.area>0?c/t.area:0,prod:t.area>0?sacas/t.area:0};
}

function resumoView(){

function spark(vals,lim){
  if(vals.length<2)return '<p class="mute" style="font-size:13px">O gráfico aparece a partir de duas leituras.</p>';
  var w=300,hgt=110,pd=14,all=vals.concat([lim]),min=Math.min.apply(null,all)-3,max=Math.max.apply(null,all)+3;
  function X(i){return pd+i*(w-2*pd)/(vals.length-1);}
  function Y(v){return hgt-pd-(v-min)/(max-min)*(hgt-2*pd);}
  var pts=vals.map(function(v,i){return [X(i),Y(v)];}),line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(hgt-pd)+' L'+line.replace(/ /g,' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+(hgt-pd)+' Z',last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+hgt+'" role="img" aria-label="Umidade nas últimas leituras"><line class="sp-lim" x1="'+pd+'" x2="'+(w-pd)+'" y1="'+Y(lim).toFixed(1)+'" y2="'+Y(lim).toFixed(1)+'"/><text class="sp-txt" x="'+pd+'" y="'+(Y(lim)-4).toFixed(1)+'">mínimo '+br(lim)+'%</text><path class="sp-area" d="'+area+'"/><polyline class="sp-line" points="'+line+'"/><circle class="sp-dot" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4"/></svg>';
}

  var h='<h2 style="margin-bottom:6px">Regras de automação</h2><p class="mute" style="margin-bottom:14px">A cada leitura nova, o sistema confere estas regras e cria alertas e tarefas sozinho. Quando a situação se resolve, o alerta some.</p><div class="stack">';
  h+=rule('baixa','Solo seco','Alerta quando a última umidade fica abaixo do mínimo do solo.',
    '<div class="rule-f"><label>Arenoso (%)<input type="number" inputmode="decimal" data-rule-val="baixa.lim.Arenoso" value="'+R.baixa.lim['Arenoso']+'"></label><label>Médio (%)<input type="number" inputmode="decimal" data-rule-val="baixa.lim.Médio" value="'+R.baixa.lim['Médio']+'"></label><label>Argiloso (%)<input type="number" inputmode="decimal" data-rule-val="baixa.lim.Argiloso" value="'+R.baixa.lim['Argiloso']+'"></label></div><label class="chk"><input type="checkbox" data-rule="baixa.tarefa"'+(R.baixa.tarefa?' checked':'')+'>Criar tarefa "Irrigar" automaticamente</label>');
  h+=rule('alta','Solo encharcado','Alerta quando a umidade passa do limite.','<div class="rule-f">'+n('alta','val','Máximo (%)')+'</div>');
  h+=rule('ph','pH fora da faixa','Alerta quando o pH da última leitura sai da faixa.','<div class="rule-f">'+n('ph','min','Mínimo',0.1)+n('ph','max','Máximo',0.1)+'</div>');
  h+=rule('queda','Queda rápida de umidade','Aviso quando a umidade cai demais entre duas leituras próximas.','<div class="rule-f">'+n('queda','val','Queda (pontos)')+'</div>');
  h+=rule('semleit','Sem leituras recentes','Alerta quando faz dias demais sem registrar leitura.','<div class="rule-f">'+n('semleit','dias','Dias sem leitura')+'</div>');
  h+=rule('colheita','Colheita chegando','Cria tarefa para planejar a colheita perto do fim do ciclo.','<div class="rule-f">'+n('colheita','dias','Dias de antecedência')+'</div>');
  h+=rule('chuva','Pausa por chuva','Não liga a irrigação nem alerta solo seco depois de uma chuva registrada.','<div class="rule-f">'+n('chuva','mm','Chuva mínima (mm)')+'</div>');
  h+=rule('offline','Sensor sem comunicação','Alerta quando um sensor passa de 3 intervalos sem enviar leitura.','');
  h+=rule('bateria','Bateria baixa','Aviso quando a bateria de um sensor fica abaixo do limite.','<div class="rule-f">'+n('bateria','val','Mínimo (%)')+'</div>');
  h+='<div class="note">Os valores iniciais foram propostos para começar e não substituem orientação agronômica. Ajuste com seu agrônomo ou técnico da cooperativa.</div>';
  return h+'</div>';
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  var d=b.dataset,D=mine();
  if(d.who){S.who=d.who;S.msg='';render();return;}
  if(!D&&!d.who&&d.act!=='recarregar')return;
  if(d.go){go(d.go);return;}
  if(d.tab){S.tab=d.tab;S.msg='';S.info='';render();return;}
  if(d.prop){S.pid=d.prop;S.tid=null;S.view='prop';S.form=null;S.msg='';render();window.scrollTo(0,0);return;}
  if(d.talhao){showT(S.pid,d.talhao);return;}
  if(d.open){var a=d.open.split('|');showT(a[0],a[1]);return;}
  if(d.dismiss){D.alerts.forEach(function(x){if(x.id===d.dismiss)x.dismissed=true;});save();render();return;}
  if(d.deltask){D.tasks=D.tasks.filter(function(x){return x.id!==d.deltask;});save();render();return;}
  if(d.delLeit){var t=talhao(prop(S.pid),S.tid);t.leituras=t.leituras.filter(function(l){return l.id!==d.delLeit;});changed();return;}
  if(d.dev){S.devId=d.dev;S.view='sens';S.form=null;S.msg='';S.info='';render();window.scrollTo(0,0);return;}
  if(d.copy){
    var src=el(d.copy),txt=src?src.textContent:'';
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent='Copiado';},function(){b.textContent='Selecione e copie';});}catch(e){b.textContent='Selecione e copie';}
    return;
  }
  if(d.delAtiv){var t2=talhao(prop(S.pid),S.tid);t2.atividades=t2.atividades.filter(function(l){return l.id!==d.delAtiv;});changed();return;}
  switch(d.act){
    case 'sair':sb.auth.signOut();break;
    case 'recarregar':location.reload();break;
    case 'nova-prop':S.view='props';S.form='prop';S.msg='';render();break;
    case 'novo-talhao':S.form='talhao';S.msg='';render();break;
    case 'nova-tarefa':S.form='tarefa';S.msg='';render();break;
    case 'cancelar':S.form=null;S.msg='';render();break;
    case 'exemplo':exemplo();S.view='props';render();break;
    case 'restaurar':D.alerts.forEach(function(x){x.dismissed=false;});save();render();break;
    case 'limpar-feitas':D.tasks=D.tasks.filter(function(x){return !x.done;});save();render();break;
    case 'del-prop':
      if(b.dataset.sure){D.props=D.props.filter(function(p){return p.id!==S.pid;});S.pid=null;evaluate();go('props');}
      else{b.dataset.sure='1';b.textContent='Toque de novo para confirmar';}
      break;
    case 'del-talhao':
      if(b.dataset.sure){var p=prop(S.pid);p.talhoes=p.talhoes.filter(function(x){return x.id!==S.tid;});S.tid=null;S.view='prop';changed();}
      else{b.dataset.sure='1';b.textContent='Toque de novo para confirmar';}
      break;
    case 'dev-novo':S.view='sens';S.devId=null;S.form='dev';S.msg='';render();break;
    case 'dev-del':
      if(b.dataset.sure){D.devices=D.devices.filter(function(x){return x.id!==S.devId;});S.devId=null;simUpdateTimer();evaluate();go('sens');}
      else{b.dataset.sure='1';b.textContent='Toque de novo para confirmar';}
      break;
    case 'sim-toggle':
      var dv=curDev(D),rr=dv?findT(D,dv.tid):null;
      if(dv&&rr){dv.sim=!dv.sim;if(dv.sim){var lr=lastRead(rr.t);dv.simU=dv.ultimaUmid!=null?dv.ultimaUmid:(lr?lr.umid:30);logEv('Simulação iniciada para '+dv.nome+'.',rr.t.id);}else logEv('Simulação parada para '+dv.nome+'.',rr.t.id);simUpdateTimer();save();render();}
      break;
    case 'sim-chuva':
      var dv2=curDev(D),r2=dv2?findT(D,dv2.tid):null;
      if(dv2&&r2){r2.t.atividades.push({id:uid(),data:today(),tipo:'Chuva',det:'Simulada',qtd:18,custo:null});dv2.rainPending=12;logEv('Chuva de 18 mm registrada em '+r2.t.nome+' (simulada).',r2.t.id);changed();}
      break;
    case 'valv-ligar':
      var tv=talhao(prop(S.pid),S.tid);
      if(tv){tv.ctrl.ligado=true;tv.ctrl.acum=0;logEv('Irrigação ligada manualmente em '+tv.nome+'.',tv.id);save();render();}
      break;
    case 'valv-desligar':
      var tv2=talhao(prop(S.pid),S.tid);
      if(tv2&&tv2.ctrl.ligado){stopValve(tv2,'desligada pelo painel',true);evaluate();render();}
      break;
    case 'bk-gerar':
      var ta=document.getElementById('bk');
      ta.value=JSON.stringify({v:2,props:D.props,tasks:D.tasks,rules:D.rules,alerts:D.alerts,devices:D.devices,log:D.log});
      ta.focus();ta.select();
      var m=document.getElementById('bk-msg');m.className='good';
      try{navigator.clipboard.writeText(ta.value).then(function(){m.textContent='Cópia gerada e copiada.';},function(){m.textContent='Cópia gerada. Selecione o texto e copie.';});}
      catch(e){m.textContent='Cópia gerada. Selecione o texto e copie.';}
      break;
    case 'bk-restaurar':
      var tx=document.getElementById('bk').value.trim(),mm=document.getElementById('bk-msg');mm.className='err';
      try{
        var o=JSON.parse(tx);
        if(!o||!Array.isArray(o.props))throw new Error('x');
        D.props=o.props;D.devices=o.devices||[];D.log=o.log||[];D.tasks=o.tasks||[];D.alerts=o.alerts||[];if(o.rules)D.rules=o.rules;
        S.info='Cópia restaurada.';changed();
        var m2=document.getElementById('bk-msg');if(m2)m2.className='good';
      }catch(e){mm.textContent='Texto inválido. Cole a cópia completa gerada por este app.';}
      break;
  }
});

/* checkboxes e valores de regras / tarefas */
document.addEventListener('change',function(ev){
  var t=ev.target,D=mine();if(!D)return;
  if(t.dataset.task){D.tasks.forEach(function(x){if(x.id===t.dataset.task)x.done=t.checked;});save();render();return;}
  if(t.dataset.ctrl){
    var tt=talhao(prop(S.pid),S.tid);if(!tt)return;
    if(t.dataset.ctrl==='on'){tt.ctrl.on=t.checked;logEv('Irrigação automática '+(t.checked?'ativada':'desativada')+' em '+tt.nome+'.',tt.id);save();render();}
    else{var cv=num(t.value);if(!isNaN(cv)&&cv>0){tt.ctrl[t.dataset.ctrl]=cv;save();}}
    return;
  }
  if(t.dataset.devf){
    var dv3=curDev(D);if(!dv3)return;var fv=num(t.value);
    if(!isNaN(fv)&&fv>0){dv3[t.dataset.devf]=fv;save();}
    return;
  }
  if(t.dataset.rule){var p=t.dataset.rule.split('.');D.rules[p[0]][p[1]]=t.checked;changed();return;}
  if(t.dataset.ruleVal){
    var v=num(t.value);if(isNaN(v))return;
    var q=t.dataset.ruleVal.split('.');
    if(q.length===3)D.rules[q[0]][q[1]][q[2]]=v;else D.rules[q[0]][q[1]]=v;
    evaluate();render();
  }
});

function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function fail(m){S.msg=m;var e=document.querySelector('.err');if(e)e.textContent=m;}

function parseDate(s){
  s=s.trim();var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}

document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form');if(!f)return;ev.preventDefault();
  var kind=f.dataset.form,D=mine();
  if(kind==='auth'){doAuth();return;}
  if(kind==='prop'){
    var nome=val('p-nome'),mun=val('p-mun'),uf=val('p-uf'),area=num(val('p-area'));
    if(nome.length<2)return fail('Informe o nome da propriedade.');
    if(mun.length<2)return fail('Informe o município.');
    if(!(area>0))return fail('Informe a área em hectares, maior que zero.');
    var np={id:uid(),nome:nome,mun:mun,uf:uf,area:area,talhoes:[]};D.props.push(np);save();
    S.form=null;S.msg='';S.pid=np.id;S.view='prop';render();return;
  }
  if(kind==='talhao'){
    var p=prop(S.pid),n=val('t-nome'),a=num(val('t-area'));
    if(n.length<1)return fail('Informe o nome do talhão.');
    if(!(a>0))return fail('Informe a área em hectares, maior que zero.');
    p.talhoes.push({id:uid(),nome:n,area:a,cultura:val('t-cult'),solo:val('t-solo'),plantio:val('t-plant'),criado:today(),atividades:[],leituras:[],ctrl:{on:false,alvo:30,max:240,vazao:4,ligado:false,acum:0}});
    S.form=null;S.msg='';changed();return;
  }
  if(kind==='leitura'){
    var t=talhao(prop(S.pid),S.tid),data=val('l-data'),u=num(val('l-umid')),phRaw=val('l-ph'),ph=phRaw===''?null:num(phRaw);
    if(!data)return fail('Informe a data da leitura.');
    if(!(u>=0&&u<=100))return fail('A umidade deve estar entre 0 e 100.');
    if(ph!==null&&!(ph>=3&&ph<=10))return fail('O pH deve estar entre 3 e 10.');
    t.leituras.push({id:uid(),data:data,ts:toDate(data).getTime(),umid:u,ph:ph,obs:val('l-obs'),fonte:'manual'});
    S.msg='';changed();return;
  }
  if(kind==='importar'){
    var tt=talhao(prop(S.pid),S.tid),lines=val('i-txt').split(/\n/),ok=0,bad=0;
    lines.forEach(function(ln){
      if(!ln.trim())return;
      var c=(ln.indexOf(';')>=0||ln.indexOf('\t')>=0)?ln.split(/[;\t]/):ln.split(',');
      var dt=parseDate(c[0]||''),um=num((c[1]||'').trim()),ph=(c[2]!=null&&c[2].trim()!=='')?num(c[2]):null;
      if(dt&&um>=0&&um<=100&&(ph===null||(ph>=3&&ph<=10))){tt.leituras.push({id:uid(),data:dt,ts:toDate(dt).getTime(),umid:um,ph:ph,obs:'importada',fonte:'importada'});ok++;}else bad++;
    });
    S.info=(ok?ok+' leitura(s) importada(s).':'')+(bad?' '+bad+' linha(s) ignorada(s) por formato inválido.':'');
    if(!ok&&!bad)S.info='Cole ao menos uma linha.';
    if(ok){changed();var em=document.getElementById('i-msg');if(em)em.className='good';}else{var e2=document.getElementById('i-msg');if(e2)e2.textContent=S.info;}
    return;
  }
  if(kind==='manejo'){
    var t3=talhao(prop(S.pid),S.tid),dm=val('m-data'),q=val('m-qtd'),c2=val('m-custo');
    if(!dm)return fail('Informe a data.');
    var qn=q===''?null:num(q),cn=c2===''?null:num(c2);
    if(qn!==null&&!(qn>=0))return fail('Quantidade inválida.');
    if(cn!==null&&!(cn>=0))return fail('Custo inválido.');
    t3.atividades.push({id:uid(),data:dm,tipo:val('m-tipo'),det:val('m-det'),qtd:qn,custo:cn});
    S.msg='';changed();return;
  }
  if(kind==='dev'){
    var sn=val('s-nome'),stid=val('s-t'),sprof=num(val('s-prof')),sint=num(val('s-int')),sseco=num(val('s-seco')),smol=num(val('s-mol'));
    if(sn.length<2)return fail('Dê um nome ao sensor.');
    if(!stid)return fail('Escolha o talhão.');
    if(!(sprof>0))return fail('Informe a profundidade em centímetros.');
    if(!(sint>0))return fail('Informe o intervalo de envio em minutos.');
    if(!(sseco>smol&&smol>=0))return fail('A leitura bruta no seco precisa ser maior que a da água.');
    var sr=findT(D,stid);
    var nd={id:uid(),nome:sn,tid:stid,pid:sr.p.id,modelo:val('s-m'),prof:sprof,intervalo:sint,seco:sseco,molhado:smol,key:newKey(),bateria:null,ultimo:0,ultimaUmid:null,sim:false,criado:Date.now()};
    D.devices.push(nd);S.form=null;S.msg='';S.devId=nd.id;evaluate();render();return;
  }
  if(kind==='teste'){
    var dv4=curDev(D);if(!dv4)return;
    var xv=val('x-val'),pl=val('x-tipo')==='raw'?{raw:Number(String(xv).replace(',','.'))}:{umid:Number(String(xv).replace(',','.'))};
    if(!xv||isNaN(pl.raw!=null?pl.raw:pl.umid)){S.info='Digite um número.';render();return;}
    pl.key=dv4.key;S.info='Enviando…';render();
    fetch(CFG.fnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)}).then(function(r){return r.json();}).then(function(j){
      S.info=j.ok?'Leitura recebida: umidade de '+br(j.umid)+'%.':'Recusada: '+j.error;render();
    }).catch(function(){S.info='Não consegui falar com o servidor.';render();});
    return;
  }
  if(kind==='tarefa'){
    var tit=val('k-tit'),due=val('k-due'),tid=val('k-t');
    if(tit.length<2)return fail('Descreva a tarefa.');
    var x={id:uid(),auto:false,titulo:tit,due:due,done:false};
    if(tid){var r=findT(D,tid);if(r){x.pid=r.p.id;x.tid=tid;x.nome=r.t.nome+' · '+r.p.nome;}}
    D.tasks.push(x);save();S.form=null;S.msg='';render();return;
  }
});

function nrm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}

function geoOf(p){
  var k='atw-geo:'+nrm(p.mun)+'|'+nrm(p.uf),c=lsGet(k);
  if(c)return Promise.resolve(c);
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(p.mun)+'&count=10&language=pt&country_code=BR').then(function(r){return r.json();}).then(function(j){
    var rs=j.results||[];if(!rs.length)throw new Error('Não encontrei o município "'+p.mun+'". Confira o nome na propriedade.');
    var st=nrm(UFN[String(p.uf||'').toUpperCase()]),hit=rs.filter(function(r){return nrm(r.admin1)===st;})[0]||rs[0];
    var g={lat:hit.latitude,lon:hit.longitude,nome:hit.name};lsSet(k,g);return g;
  });
}
function fetchClima(p){
  return geoOf(p).then(function(g){
    var u='https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+'&timezone=auto&past_days=3&forecast_days=7'+
    '&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code'+
    '&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,soil_temperature_6cm,soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm,soil_moisture_27_to_81cm'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,et0_fao_evapotranspiration,wind_speed_10m_max';
    return fetch(u).then(function(r){if(!r.ok)throw new Error('O serviço de clima respondeu '+r.status+'.');return r.json();}).then(function(j){
      if(!j.daily||!j.hourly)throw new Error('Resposta do clima incompleta.');
      return {geo:g,cur:j.current,h:j.hourly,d:j.daily,at:Date.now()};
    });
  });
}
function loadClima(p){
  var c=CLIMA[p.id]||(CLIMA[p.id]={st:'idle'});
  if(c.busy)return;c.busy=true;if(!c.data)c.st='load';
  fetchClima(p).then(function(d){c.data=d;c.st='ok';c.msg='';lsSet('atw-clima:'+p.id,{data:d});})
  .catch(function(e){c.st=c.data?'ok':'err';c.msg=(e&&e.message)||'Falha de rede.';})
  .then(function(){c.busy=false;c.tried=Date.now();if((S.view==='clima'||S.view==='resumo')&&!isTyping())render();});
}
function climaOf(p){
  var c=CLIMA[p.id];
  if(!c){var ls=lsGet('atw-clima:'+p.id);c=CLIMA[p.id]=ls&&ls.data?{st:'ok',data:ls.data}:{st:'idle'};}
  var stale=c.data&&Date.now()-c.data.at>1800000;
  if(p.mun&&!c.busy&&(c.st==='idle'||stale||(c.st==='err'&&Date.now()-c.tried>60000)))loadClima(p);
  return c;
}
/* índices úteis */
function ix(cl){
  var d=cl.d,t=today(),di=d.time.indexOf(t);if(di<0)di=3;
  var hh=(cl.cur&&cl.cur.time||'').slice(0,13),hi=cl.h.time.findIndex(function(x){return x.slice(0,13)>=hh;});if(hi<0)hi=di*24;
  return {di:di,hi:hi};
}
function sum(a,i,n){var s=0;for(var k=i;k<i+n&&k<a.length;k++)s+=(a[k]||0);return s;}
function dayLbl(cl,di){var s=cl.d.time[di];return s?DSEM[toDate(s).getDay()]:'';}
function kcOf(t){
  var k=KC[t.cultura];if(!k||!t.plantio)return null;
  var dia=daysBetween(t.plantio,today()),f=dia/CICLO[t.cultura];if(f<0||f>1)return null;
  var e=f<.2?0:f<.75?1:2;return {kc:k[e],est:KCN[e]};
}
/* motor de recomendações: regras agronômicas propostas, validar com agrônomo */
function spray(cl,I){
  var h=cl.h,out=[];
  for(var i=0;i<h.time.length;i++){
    var w=h.wind_speed_10m[i],rh=h.relative_humidity_2m[i],t=h.temperature_2m[i],r=sum(h.precipitation,i,3);
    out.push(w>=3&&w<=10&&rh>=55&&t<=30&&r===0);
  }
  var best=null,s=-1;
  for(var j=I.hi;j<=Math.min(out.length,I.hi+48);j++){
    if(out[j]&&s<0)s=j;
    if((!out[j]||j===out.length)&&s>=0){if(!best||j-s>best.n)best={s:s,n:j-s};s=-1;}
  }
  if(best&&best.n<2)best=null;
  return {ok:out,best:best};
}
function recomendar(p,cl,d){
  var I=ix(cl),D=cl.d,H=cl.h,R=[],tal=[];
  p.talhoes.forEach(function(t){var k=kcOf(t);if(k)tal.push(k.kc);});
  var kc=tal.length?tal.reduce(function(a,b){return a+b;},0)/tal.length:1,
      r48=sum(D.precipitation_sum,I.di,2),r3=sum(D.precipitation_sum,I.di,3),et3=sum(D.et0_fao_evapotranspiration,I.di,3)*kc,def=et3-r3;
  if(r48>=12)R.push({n:'info',t:'Segure a irrigação',x:'Há '+br(r48,0)+' mm de chuva prevista em 48 h. Espere a chuva passar antes de irrigar.'});
  else if(def>=10)R.push({n:def>=20?'crit':'warn',t:'Irrigação recomendada',x:'Nos próximos 3 dias a lavoura deve perder cerca de '+br(et3,0)+' mm e a chuva prevista é de '+br(r3,0)+' mm. Déficit de ~'+br(def,0)+' mm (≈ '+br(def*10,0)+' m³ por hectare).'});
  else R.push({n:'ok',t:'Água em dia',x:'Chuva prevista ('+br(r3,0)+' mm) e demanda da cultura ('+br(et3,0)+' mm) estão equilibradas nos próximos 3 dias.'});
  var tmin=Infinity,td=0;for(var i=I.di;i<I.di+4&&i<D.time.length;i++){if(D.temperature_2m_min[i]<tmin){tmin=D.temperature_2m_min[i];td=i;}}
  if(tmin<=1)R.push({n:'crit',t:'Risco de geada',x:'Mínima de '+br(tmin,0)+' °C na '+dayLbl(cl,td)+'. Proteja culturas sensíveis e evite plantar ou aplicar nessa madrugada.'});
  else if(tmin<=3)R.push({n:'warn',t:'Frio intenso',x:'Mínima de '+br(tmin,0)+' °C na '+dayLbl(cl,td)+'. Fique atento à possibilidade de geada em baixadas.'});
  var tmax=-Infinity,xd=0;for(i=I.di;i<I.di+4&&i<D.time.length;i++){if(D.temperature_2m_max[i]>tmax){tmax=D.temperature_2m_max[i];xd=i;}}
  if(tmax>=35)R.push({n:'warn',t:'Calor forte',x:'Máxima de '+br(tmax,0)+' °C na '+dayLbl(cl,xd)+'. Há risco de estresse térmico e de maior demanda de água.'});
  var pm=0,pd=0;for(i=I.di;i<I.di+3&&i<D.time.length;i++){if(D.precipitation_sum[i]>pm){pm=D.precipitation_sum[i];pd=i;}}
  if(pm>=50)R.push({n:'warn',t:'Chuva muito forte',x:'Previsão de '+br(pm,0)+' mm na '+dayLbl(cl,pd)+'. Atenção a encharcamento e erosão nos talhões.'});
  var sp=spray(cl,I);
  if(sp.best){var s=sp.best.s,e=s+sp.best.n,dy=Math.floor(s/24)-I.di,hs=s%24,he=e%24;
    R.push({n:'info',t:'Janela de pulverização',x:'Melhor período nas próximas 48 h: '+(dy<=0?'hoje':dy===1?'amanhã':'em '+dy+' dias')+', das '+hs+'h às '+he+'h (vento entre 3 e 10 km/h, umidade acima de 55%, sem chuva).'});
  }else R.push({n:'warn',t:'Sem janela boa para pulverizar',x:'Nas próximas 48 h o vento, a umidade ou a chuva não ficam nos limites seguros. Adie a aplicação.'});
  var fh=0;for(i=I.hi;i<I.hi+72&&i<H.time.length;i++){if(H.relative_humidity_2m[i]>=90&&H.temperature_2m[i]>=18&&H.temperature_2m[i]<=30)fh++;}
  if(fh>=30)R.push({n:'warn',t:'Clima favorável a doenças',x:'Cerca de '+fh+' horas com umidade acima de 90% e temperatura entre 18 e 30 °C nos próximos 3 dias. Vistorie os talhões atrás de ferrugem e manchas foliares.'});
  var o={crit:0,warn:1,info:2,ok:3};R.sort(function(a,b){return o[a.n]-o[b.n];});
  return R;
}
function recCard(r,pre){
  return '<div class="al '+r.n+'"><div><span class="pill '+r.n+'">'+({crit:'Urgente',warn:'Atenção',info:'Dica',ok:'Tudo certo'})[r.n]+'</span> <b>'+(pre?esc(pre)+' · ':'')+esc(r.t)+'</b></div><p style="font-size:14px">'+esc(r.x)+'</p></div>';
}
/* início: cartão de clima e recomendações */
function homeClima(d){
  var p=d.props.filter(function(x){return x.mun;})[0];if(!p)return '';
  var c=climaOf(p);
  if(!c.data)return '<div class="card"><h3>Clima de '+esc(p.mun)+'</h3><p class="mute" style="margin-top:6px">'+(c.st==='err'?esc(c.msg):'Buscando clima e previsão…')+'</p></div>';
  var cl=c.data,cu=cl.cur,R=recomendar(p,cl,d).slice(0,3),h='';
  h+='<div class="card"><div class="row"><div><span class="eyebrow">'+esc(p.mun)+(p.uf?' · '+esc(p.uf):'')+'</span><div class="temp"><b>'+br(cu.temperature_2m,0)+'°</b><span>'+wmo(cu.weather_code)+'</span></div></div>'+
    '<button class="btn small" data-go="clima">Clima e solo</button></div>'+
    '<div class="chips"><span>Umidade do ar '+br(cu.relative_humidity_2m,0)+'%</span><span>Vento '+br(cu.wind_speed_10m,0)+' km/h</span><span>Chuva 3 dias '+br(sum(cl.d.precipitation_sum,ix(cl).di,3),0)+' mm</span></div></div>';
  h+='<div class="stack" style="gap:8px"><h3>Recomendações do dia</h3>'+R.map(function(r){return recCard(r);}).join('')+'</div>';
  return h;
}
/* aba Clima e solo */
function svgChuva(cl,I){
  var D=cl.d,n=Math.min(10,D.time.length),W=330,Hh=120,bw=W/n,mx=5;
  for(var i=0;i<n;i++){mx=Math.max(mx,D.precipitation_sum[i]||0,D.et0_fao_evapotranspiration[i]||0);}
  var s='<svg class="spark" viewBox="0 0 '+W+' '+(Hh+22)+'" role="img" aria-label="Chuva e evapotranspiração por dia">';
  for(i=0;i<n;i++){
    var r=D.precipitation_sum[i]||0,e=D.et0_fao_evapotranspiration[i]||0,x=i*bw,bh=r/mx*Hh,ey=Hh-e/mx*Hh;
    s+='<rect x="'+(x+6)+'" y="'+(Hh-bh)+'" width="'+(bw-12)+'" height="'+bh+'" rx="4" fill="'+(i<I.di?'#9CC3F0':'var(--water)')+'"/>'+
       '<line x1="'+(x+3)+'" x2="'+(x+bw-3)+'" y1="'+ey+'" y2="'+ey+'" stroke="#D18B00" stroke-width="3" stroke-linecap="round"/>'+
       '<text class="sp-txt" x="'+(x+bw/2)+'" y="'+(Hh+15)+'" text-anchor="middle"'+(i===I.di?' font-weight="700"':'')+'>'+(i===I.di?'hoje':dayLbl(cl,i))+'</text>';
  }
  return s+'</svg>';
}
function climaView(){
  var d=mine(),h='<div class="row" style="margin-bottom:10px"><h2>Clima e solo</h2><button class="btn small" data-cretry="1">Atualizar</button></div>';
  if(!d.props.length)return h+'<div class="empty"><b>Cadastre uma propriedade</b>Informe o município e a AgroTwin busca o clima, a previsão e o solo do local.<div style="margin-top:14px"><button class="btn main" data-go="props">Cadastrar propriedade</button></div></div>';
  var p=d.props.filter(function(x){return x.id===S.cpid;})[0]||d.props[0];S.cpid=p.id;
  h+='<div class="stack">';
  if(d.props.length>1)h+='<div class="seg" role="group" aria-label="Propriedade">'+d.props.map(function(x){return '<button type="button" data-cprop="'+x.id+'" aria-pressed="'+(x.id===p.id)+'">'+esc(x.nome)+'</button>';}).join('')+'</div>';
  if(!p.mun)return h+'<div class="note">Esta propriedade não tem município. Edite a propriedade e informe o município e o estado.</div></div>';
  var c=climaOf(p);
  if(!c.data)return h+'<div class="card"><h3>'+(c.st==='err'?'Não consegui buscar o clima':'Buscando dados de '+esc(p.mun)+'…')+'</h3><p class="mute" style="margin-top:6px">'+esc(c.msg||'Isso leva alguns segundos.')+'</p></div></div>';
  var cl=c.data,cu=cl.cur,I=ix(cl),D=cl.d,H=cl.h,hh=new Date(cl.at);
  h+='<div class="card"><span class="livepill"><i></i>'+esc(cl.geo.nome)+' · '+pad2(hh.getHours())+':'+pad2(hh.getMinutes())+'</span><div class="temp"><b>'+br(cu.temperature_2m,0)+'°</b><span>'+wmo(cu.weather_code)+'</span></div>'+
    '<div class="chips"><span>Umidade do ar '+br(cu.relative_humidity_2m,0)+'%</span><span>Vento '+br(cu.wind_speed_10m,0)+' km/h</span><span>Chuva agora '+br(cu.precipitation,1)+' mm</span></div>'+(c.msg?'<p class="note" style="margin-top:10px">Mostrando o último clima salvo: '+esc(c.msg)+'</p>':'')+'</div>';
  h+='<div class="stack" style="gap:8px"><h3>Recomendações</h3>'+recomendar(p,cl,d).map(function(r){return recCard(r);}).join('')+'</div>';
  h+='<div class="card"><h3 style="margin-bottom:10px">Próximos 7 dias</h3><div class="days">';
  for(var i=I.di;i<Math.min(I.di+7,D.time.length);i++){
    h+='<div class="dayc"><b>'+(i===I.di?'Hoje':i===I.di+1?'Amanhã':dayLbl(cl,i))+'</b><span class="mono">'+br(D.temperature_2m_max[i],0)+'° <em>'+br(D.temperature_2m_min[i],0)+'°</em></span><span class="mute">'+wmo(D.weather_code[i])+'</span><span class="rain">'+br(D.precipitation_sum[i],0)+' mm · '+br(D.precipitation_probability_max[i]||0,0)+'%</span></div>';
  }
  h+='</div></div><div class="card"><h3>Chuva e demanda de água</h3><p class="mute" style="font-size:13px;margin:4px 0 10px">Barras: chuva em mm. Traço amarelo: evapotranspiração de referência. Os 3 primeiros dias já passaram.</p>'+svgChuva(cl,I)+'</div>';
  h+='<div class="card"><h3 style="margin-bottom:10px">Demanda de água por talhão hoje</h3><div class="bars">';
  var et=D.et0_fao_evapotranspiration[I.di]||0,any=false;
  p.talhoes.forEach(function(t){
    var k=kcOf(t);any=true;
    h+='<div class="bar"><div class="bar-h"><span>'+esc(t.nome)+'</span><span class="mono">'+(k?br(et*k.kc,1)+' mm':'—')+'</span></div><span class="mute" style="font-size:12.5px">'+(k?esc(t.cultura)+' em '+k.est+' · Kc '+br(k.kc,2)+' · ≈ '+br(et*k.kc*10,0)+' m³/ha':'Informe a cultura e a data de plantio para calcular.')+'</span></div>';
  });
  if(!any)h+='<p class="mute">Cadastre talhões nesta propriedade.</p>';
  h+='</div><p class="mute" style="font-size:12px;margin-top:10px">ETc = ET0 × Kc (método FAO-56). ET0 de hoje: '+br(et,1)+' mm.</p></div>';
  var dp=[['0–1 cm','soil_moisture_0_to_1cm'],['3–9 cm','soil_moisture_3_to_9cm'],['9–27 cm','soil_moisture_9_to_27cm'],['27–81 cm','soil_moisture_27_to_81cm']];
  h+='<div class="card"><h3 style="margin-bottom:10px">Solo agora (modelo)</h3><div class="bars">';
  dp.forEach(function(x){var v=(H[x[1]][I.hi]||0)*100;h+='<div class="bar"><div class="bar-h"><span>'+x[0]+'</span><span class="mono">'+br(v,0)+'%</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,v/60*100)+'%"></div></div></div>';});
  var ts=H.soil_temperature_6cm[I.hi];
  h+='</div><p style="margin-top:12px"><b class="mono">'+br(ts||0,1)+' °C</b> <span class="mute">a 6 cm de profundidade</span></p><div class="chips" style="margin-top:8px">';
  Object.keys(SEMT).forEach(function(k){h+='<span>'+k+': '+(ts>=SEMT[k]?'solo quente o bastante':'solo frio para semear')+'</span>';});
  h+='</div><p class="note" style="margin-top:12px">Estimativa de modelo para a região. O sensor no talhão é mais fiel que este valor.</p></div>';
  var sp=spray(cl,I);
  h+='<div class="card"><h3>Janela de pulverização</h3><p class="mute" style="font-size:13px;margin:4px 0 12px">Verde: vento de 3 a 10 km/h, umidade acima de 55%, até 30 °C e sem chuva por 3 h.</p>';
  [0,1].forEach(function(dy){
    h+='<div class="hrs-l">'+(dy?'Amanhã':'Hoje')+'</div><div class="hrs">';
    for(var k=0;k<24;k++){var j=(I.di+dy)*24+k,rn=(H.precipitation[j]||0)>0;h+='<i class="'+(j<I.hi?'past':sp.ok[j]?'ok':rn?'rn':'')+'" title="'+k+'h"></i>';}
    h+='</div><div class="hrs-t"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>';
  });
  h+='</div><p class="note">Dados: Open-Meteo (clima, previsão e modelo de solo). As recomendações são regras propostas e precisam de revisão de um agrônomo antes de orientar decisões.</p></div>';
  return h;
}
function pad2(n){return n<10?'0'+n:''+n;}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.cprop){S.cpid=b.dataset.cprop;render();}
  if(b.dataset.cretry){var D=mine(),p=D&&D.props.filter(function(x){return x.id===S.cpid;})[0]||(D&&D.props[0]);if(p){var c=CLIMA[p.id]||(CLIMA[p.id]={st:'idle'});c.busy=false;loadClima(p);render();}}
});
/* aba Mais */
function maisView(){
  var d=mine(),nt=d.tasks.filter(function(t){return !t.done;}).length;
  function it(v,t,s,b){return '<button class="item" data-go="'+v+'"><div><b>'+t+(b?' <span class="pill auto">'+b+'</span>':'')+'</b><small>'+s+'</small></div><span class="chev">›</span></button>';}

    it('regras','Regras de automação','Limites de umidade, pH, chuva e colheita que geram alertas e tarefas.','')+'</div>';
}
ICON.clima='<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.5 1A3.5 3.5 0 0 0 7 18z"/></svg>';
ICON.mais='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
function nav(){
  var d=mine(),na=d.alerts.filter(function(a){return !a.dismissed;}).length,nt=d.tasks.filter(function(t){return !t.done;}).length;
  var act=(S.view==='prop'||S.view==='talhao')?'props':(S.view==='sens'||S.view==='tarefas'||S.view==='regras')?'mais':S.view;
  function b(v,l,badge){return '<button class="nb" data-go="'+v+'" aria-current="'+(act===v?'page':'false')+'">'+ICON[v]+l+(badge?'<span class="badge">'+badge+'</span>':'')+'</button>';}

}
